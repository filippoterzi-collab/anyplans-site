<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>presenze · anyplans</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="robots" content="noindex">
<style>
  @font-face{
    font-family:"Bricolage Grotesque";
    src:url("/bricolage-grotesque-latin-800-normal.woff2") format("woff2");
    font-weight:800; font-style:normal; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  :root{
    --blue:#1B4FD8; --blue-lo:#1440AF; --tint:#E9EEFB;
    --ink:#191919; --grey:#6E6E73; --bg:#FBF9F5; --red:#B3261E;
    --round: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Bricolage Grotesque", var(--round);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--round); color:var(--ink); background:var(--bg); line-height:1.5; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  .display{font-family:var(--display); font-weight:800; letter-spacing:-.045em; line-height:1.05; text-transform:lowercase;}
  .q{font-size:.92em;}
  header{padding:0 22px;}
  .nav{display:flex; align-items:center; justify-content:space-between; height:64px; max-width:760px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:800; font-size:20px; letter-spacing:-.045em; line-height:1; text-transform:lowercase;}
  .brand img{width:28px; height:28px;}
  .lnk{font-weight:700; font-size:14px; color:var(--blue);}
  main{max-width:760px; margin:0 auto; padding:10px 22px 90px; display:flex; flex-direction:column; gap:16px;}
  h1{font-size:30px;}
  .sub{font-size:14px; color:var(--grey);}
  .stat{display:flex; align-items:baseline; gap:8px;}
  .stat b{font-family:var(--display); font-weight:800; font-size:44px; letter-spacing:-.045em; color:var(--blue); line-height:1;}
  .stat span{font-weight:600; color:var(--grey);}
  .bar{height:8px; background:var(--tint); border-radius:999px; overflow:hidden;}
  .bar div{height:100%; background:var(--blue); width:0; transition:width .3s;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--blue); color:#fff; font-weight:700; padding:14px 24px; border-radius:999px; border:none; cursor:pointer; font-size:15.5px; font-family:var(--round);}
  .btn.ghost{background:transparent; color:var(--blue); box-shadow:inset 0 0 0 2px var(--blue);}
  .btn:active{transform:scale(.97);}
  .search{display:flex; align-items:center; gap:9px; background:#fff; border:1.5px solid rgba(25,25,25,.16); border-radius:999px; padding:10px 15px;}
  .search input{border:none; outline:none; font-size:15px; font-family:var(--round); background:transparent; width:100%;}
  .row{display:flex; align-items:center; gap:12px; background:#fff; border:1.5px solid rgba(25,25,25,.10); border-radius:16px; padding:12px 14px; cursor:pointer; user-select:none;}
  .row.in{border-color:var(--blue); background:var(--tint);}
  .avatar{width:40px; height:40px; border-radius:999px; background:var(--blue); color:#fff; font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background-size:cover; background-position:center;}
  .row .n{font-weight:700; font-size:15px;} .row .s{font-size:12.5px; color:var(--grey);}
  .circle{margin-left:auto; width:30px; height:30px; border-radius:999px; border:2px solid rgba(25,25,25,.25); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; flex-shrink:0;}
  .row.in .circle{background:var(--blue); border-color:var(--blue);}
  .note{font-size:13px; color:var(--grey);}
  .ov{position:fixed; inset:0; background:#191919; z-index:60; display:flex; flex-direction:column;}
  .ov video{flex:1; width:100%; object-fit:cover;}
  .ov .top{position:absolute; top:0; left:0; right:0; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; color:#fff; font-weight:700; background:linear-gradient(rgba(0,0,0,.6), transparent);}
  .ov .x{width:36px; height:36px; border-radius:999px; background:rgba(255,255,255,.2); border:none; color:#fff; font-size:18px; font-weight:700; cursor:pointer;}
  .ov .frame{position:absolute; left:50%; top:50%; width:240px; height:240px; transform:translate(-50%,-50%); border:3px solid #fff; border-radius:22px; box-shadow:0 0 0 2000px rgba(0,0,0,.35);}
  .ov .res{position:absolute; left:16px; right:16px; bottom:28px; background:#fff; border-radius:18px; padding:16px 18px; font-weight:700; display:flex; align-items:center; gap:12px;}
  .ov .res .s{font-weight:600; font-size:13px; color:var(--grey);}
  .ov .res.ok{border:2px solid var(--blue);}
  [hidden]{display:none !important;}
  @keyframes sk{from{background-position:200% 0} to{background-position:-200% 0}}
  .sk{height:64px; border-radius:16px; background:linear-gradient(90deg,#F1EFE9 25%,#E9E6DE 50%,#F1EFE9 75%); background-size:200% 100%; animation:sk 1.2s ease-in-out infinite;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="/v2/"><img src="/logo.png" alt=""><span>anyplans<span class="q">?</span></span></a>
    <a class="lnk" id="back" href="eventi.html">← torna all'evento</a>
  </div>
</header>

<main>
  <div>
    <h1 class="display">chi è arrivato</h1>
    <p class="sub" id="sub">carico…</p>
  </div>
  <div class="stat"><b id="n-in">0</b><span id="n-tot">su 0 iscritti</span></div>
  <div class="bar"><div id="bar"></div></div>
  <div style="display:flex; gap:10px; flex-wrap:wrap">
    <button class="btn" onclick="openScanner()">📷 inquadra il biglietto</button>
  </div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg>
    <input id="q" placeholder="cerca un nome" oninput="render()">
  </div>
  <div id="list" style="display:flex; flex-direction:column; gap:8px"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <p class="note">tocca il cerchio accanto al nome per segnare chi è arrivato. la fotocamera non è obbligatoria.</p>
</main>

<div class="ov" id="scan" hidden>
  <video id="video" playsinline muted></video>
  <div class="top"><span id="scan-title">inquadra il codice quadrato sul biglietto</span><button class="x" onclick="closeScanner()">×</button></div>
  <div class="frame"></div>
  <div class="res" id="res" hidden><div class="avatar" id="res-av"></div><div><div id="res-n"></div><div class="s" id="res-s"></div></div></div>
</div>

<script src="app.js?v=1788505164"></script>
<script>
  requireLogin();
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const tokenFromQr = params.get("t");
  let ev = null, people = [];

  async function load(){
    if (!id) { location.replace("miei.html"); return; }
    document.getElementById("back").href = "evento.html?id=" + id;
    const r = await rpc("activity_by_id", { p_id: id });
    ev = r && r.ok ? (await r.json().catch(() => []))[0] : null;
    if (!ev) { document.getElementById("sub").textContent = "evento non trovato."; return; }
    const when = new Date(ev.start_at);
    document.getElementById("sub").textContent = ev.title + " · " + dayLabel(when) + " " + timeStr(when);
    await loadPeople();
    if (tokenFromQr) { history.replaceState(null, "", "checkin.html?id=" + id); checkInToken(tokenFromQr, true); }
  }
  async function loadPeople(){
    const r = await rpc("get_participants", { p_activity_id: id });
    if (!r || !r.ok) { document.getElementById("list").innerHTML = '<p class="note">non riesco a caricare gli iscritti. questa pagina è solo per chi organizza.</p>'; return; }
    people = (await r.json().catch(() => [])).filter(p => p.status === "going");
    render();
  }
  function render(){
    const q = document.getElementById("q").value.trim().toLowerCase();
    const inN = people.filter(p => p.checked_in).length;
    document.getElementById("n-in").textContent = inN;
    document.getElementById("n-tot").textContent = "su " + people.length + " iscritti";
    document.getElementById("bar").style.width = (people.length ? Math.round(inN / people.length * 100) : 0) + "%";
    const rows = people.filter(p => !q || (p.display_name || "").toLowerCase().includes(q))
      .sort((a, b) => (a.display_name || "").localeCompare(b.display_name || ""));
    document.getElementById("list").innerHTML = rows.map(p =>
      `<div class="row${p.checked_in ? " in" : ""}" onclick="toggle('${p.user_id}')">
        <div class="avatar"${p.avatar_url ? ` style="background-image:url('${esc(p.avatar_url)}')"` : ""}>${p.avatar_url ? "" : esc((p.display_name || "?")[0].toLowerCase())}</div>
        <div><div class="n">${esc(p.display_name || "qualcuno")}</div><div class="s">${p.role === "admin" ? "collaboratore · " : ""}${p.checked_in ? "presente ✓" : "non ancora"}</div></div>
        <div class="circle">${p.checked_in ? "✓" : ""}</div>
      </div>`).join("") || '<p class="note">nessuno con questo nome.</p>';
  }
  async function toggle(uid){
    const p = people.find(x => x.user_id === uid); if (!p) return;
    const want = !p.checked_in;
    p.checked_in = want; render();
    const r = await rpc("check_in_user", { p_activity_id: id, p_user_id: uid, p_present: want });
    if (!r || !r.ok) { p.checked_in = !want; render(); toast("non ha funzionato, riprova."); }
    else track("checkin_manual");
  }

  // ---- scanner: barcodedetector nativo se c'è, altrimenti jsqr ----
  let stream = null, scanning = false, detector = null, lastToken = "";
  async function openScanner(){
    const ov = document.getElementById("scan"); ov.hidden = false;
    document.getElementById("res").hidden = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
    } catch (_) { toast("non riesco ad aprire la fotocamera. segna le persone dalla lista qui sotto."); ov.hidden = true; return; }
    const v = document.getElementById("video"); v.srcObject = stream; await v.play();
    scanning = true;
    if ("BarcodeDetector" in window) { try { detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (_) { detector = null; } }
    if (!detector && !window.jsQR) await loadJsQr();
    scanLoop();
  }
  function loadJsQr(){
    return new Promise(res => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; s.onload = res; s.onerror = res; document.head.appendChild(s); });
  }
  const cv = document.createElement("canvas");
  async function scanLoop(){
    if (!scanning) return;
    const v = document.getElementById("video");
    let text = null;
    try {
      if (detector) { const codes = await detector.detect(v); if (codes.length) text = codes[0].rawValue; }
      else if (window.jsQR && v.videoWidth) {
        cv.width = v.videoWidth; cv.height = v.videoHeight;
        const x = cv.getContext("2d"); x.drawImage(v, 0, 0);
        const d = x.getImageData(0, 0, cv.width, cv.height);
        const code = jsQR(d.data, d.width, d.height, { inversionAttempts: "dontInvert" });
        if (code) text = code.data;
      }
    } catch (_) {}
    if (text) {
      const m = text.match(/[?&]t=([0-9a-f-]{36})/i);
      if (m && m[1] !== lastToken) { lastToken = m[1]; await checkInToken(m[1], false); setTimeout(() => { lastToken = ""; }, 4000); }
    }
    setTimeout(scanLoop, detector ? 250 : 120);
  }
  function closeScanner(){
    scanning = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    document.getElementById("scan").hidden = true;
  }
  async function checkInToken(token, fromUrl){
    const r = await rpc("check_in", { p_token: token });
    if (!r || !r.ok) {
      const b = r ? await r.json().catch(() => ({})) : {};
      const code = b.message || "";
      const msg = code.includes("invalid_ticket") ? "biglietto non valido" : code.includes("not_allowed") ? "solo chi organizza può segnare le presenze" : "non ha funzionato, riprova";
      if (fromUrl) toast(msg); else showRes(null, msg, false);
      return;
    }
    const row = (await r.json().catch(() => []))[0];
    if (!row) return;
    track("checkin_scan");
    const p = people.find(x => x.user_id === row.user_id); if (p) p.checked_in = true; render();
    const s = (row.already ? "già presente" : "presente ✓") + " · " + row.checked_count + " arrivati su " + row.going_count;
    if (fromUrl) toast(row.display_name + (row.already ? ": già presente." : " è qui!")); else showRes(row.display_name, s, true);
  }
  function showRes(name, s, ok){
    const res = document.getElementById("res"); res.hidden = false; res.className = "res" + (ok ? " ok" : "");
    document.getElementById("res-av").textContent = name ? name[0].toLowerCase() : "!";
    document.getElementById("res-n").textContent = name ? name + (s.startsWith("già") ? ": già presente" : " è qui") : "ops";
    document.getElementById("res-s").textContent = s;
    if (navigator.vibrate) navigator.vibrate(ok ? 60 : [40, 60, 40]);
  }
  load();
</script>
</body>
</html>
