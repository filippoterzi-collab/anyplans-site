<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crea evento · anyplans</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
  @font-face{
    font-family:"Bricolage Grotesque";
    src:url("/bricolage-grotesque-latin-800-normal.woff2") format("woff2");
    font-weight:800; font-style:normal; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  :root{
    --blue:#1B4FD8; --blue-lo:#1440AF; --tint:#E9EEFB;
    --ink:#191919; --grey:#6E6E73; --bg:#FBF9F5;
    --round: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Bricolage Grotesque", var(--round);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--round); color:var(--ink); background:var(--bg); line-height:1.5;
       -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  .display{font-family:var(--display); font-weight:800; letter-spacing:-.045em; line-height:1.05;
           text-transform:lowercase;}
  .q{font-size:.92em;}
  header{padding:0 22px;}
  .nav{display:flex; align-items:center; justify-content:space-between; height:64px; max-width:720px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:800;
         font-size:20px; letter-spacing:-.045em; line-height:1; text-transform:lowercase;}
  .brand img{width:28px; height:28px;}
  main{max-width:720px; margin:0 auto; padding:10px 22px 70px; display:flex; flex-direction:column; gap:18px;}
  h1{font-size:32px;}
  label{font-weight:700; font-size:14px; display:block; margin-bottom:8px;}
  .hint{font-size:12.5px; color:var(--grey); margin-top:6px;}
  input, select, textarea{width:100%; background:#fff; border:1.5px solid rgba(25,25,25,.16);
    border-radius:12px; padding:13px 16px; font-size:16px; font-family:var(--round); color:var(--ink);}
  textarea{min-height:90px; resize:vertical;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .btn{display:block; width:100%; background:var(--blue); color:#fff; font-weight:700;
       padding:15px 0; border-radius:999px; border:none; cursor:pointer; font-size:16.5px;
       font-family:var(--round); text-align:center;}
  .btn:hover{background:var(--blue-lo);}
  .btn[disabled]{opacity:.55; cursor:default;}
  #map{height:260px; border-radius:16px;}
  .toggle-row{display:flex; align-items:center; gap:12px; background:#fff;
    border:1.5px solid rgba(25,25,25,.12); border-radius:14px; padding:14px 16px; cursor:pointer;}
  .toggle-row .t{font-weight:600; font-size:15px;}
  .toggle-row .s{font-size:12.5px; color:var(--grey);}
  .sw{margin-left:auto; width:42px; height:25px; background:rgba(25,25,25,.15); border-radius:999px;
      display:flex; align-items:center; padding:0 3px; flex-shrink:0; transition:background .15s;}
  .sw .k{width:19px; height:19px; background:#fff; border-radius:999px; transition:transform .15s;}
  .toggle-row.on .sw{background:var(--blue);}
  .toggle-row.on .sw .k{transform:translateX(17px);}
  .note{font-size:13.5px; color:var(--grey); min-height:1.3em;}
  .note.err{color:#B3261E; font-weight:600;}
  @media (max-width:600px){ .grid2{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="/v2/"><img src="/logo.png" alt=""><span>anyplans<span class="q">?</span></span></a>
    <a style="font-weight:700; font-size:14px; color:var(--blue)" href="eventi.html">← gli eventi</a>
  </div>
</header>

<main>
  <h1 class="display">crea evento</h1>

  <div>
    <label for="sport">che tipo di evento è?</label>
    <select id="sport"></select>
  </div>

  <div>
    <label for="title">nome dell'evento</label>
    <input id="title" type="text" required minlength="3" placeholder="es. corso di ceramica, anche principianti">
  </div>

  <div class="grid2">
    <div>
      <label for="date">giorno</label>
      <input id="date" type="date" required>
    </div>
    <div>
      <label for="time">ora</label>
      <input id="time" type="time" required value="19:00">
    </div>
  </div>

  <div>
    <label for="place">punto di ritrovo</label>
    <input id="place" type="text" required placeholder="es. laboratorio in via gombito 12, città alta">
    <p class="hint">poi tocca la mappa per mettere il segnaposto esatto.</p>
  </div>

  <div>
    <div id="map"></div>
    <p class="hint" id="map-hint">tocca la mappa per posizionare il punto di ritrovo</p>
  </div>

  <div>
    <label for="desc">descrizione <span style="color:var(--grey); font-weight:600">(se vuoi)</span></label>
    <textarea id="desc" placeholder="due righe per chi non ti conosce: cosa si fa, cosa portare…"></textarea>
  </div>

  <div class="grid2">
    <div>
      <label for="maxp">posti <span style="color:var(--grey); font-weight:600">(vuoto = illimitati)</span></label>
      <input id="maxp" type="number" min="2" placeholder="es. 12">
    </div>
  </div>

  <div class="toggle-row" id="vis" onclick="this.classList.toggle('on')">
    <div>
      <div class="t">richiedi approvazione</div>
      <div class="s">approvi tu chi partecipa, e l'indirizzo esatto lo vedono solo gli approvati</div>
    </div>
    <div class="sw"><div class="k"></div></div>
  </div>

  <button class="btn" id="btn" onclick="createEvent()">crea l'evento</button>
  <p class="note" id="note">gratis · chi lo crea è dentro automaticamente</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="app.js"></script>
<script>
  requireLogin();

  // profilo obbligatorio per creare
  rpc("my_profile").then(async r => {
    if (r && r.ok) {
      const rows = await r.json().catch(() => []);
      if (!rows.length || !rows[0].display_name) {
        try { sessionStorage.setItem("anyplans_next", "crea.html"); } catch (_) {}
        location.replace("profilo.html");
      }
    }
  });

  // select categorie dal catalogo (community prima, poi sport)
  const sel = document.getElementById("sport");
  const first = ["ceramics","cooking","painting","gardening","festival","yoga"];
  const order = [...first, ...Object.keys(CATALOG).filter(s => !first.includes(s))];
  order.forEach(slug => {
    const o = document.createElement("option");
    o.value = slug; o.textContent = CATALOG[slug].e + "  " + CATALOG[slug].l;
    sel.appendChild(o);
  });

  // data minima oggi
  const today = new Date();
  document.getElementById("date").min = today.toISOString().slice(0, 10);
  document.getElementById("date").value = today.toISOString().slice(0, 10);

  // mappa: tocca per piazzare il punto
  let point = null, marker = null;
  const map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/liberty",
                                   center: [9.670, 45.698], zoom: 12.5 });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
  map.on("click", (e) => {
    point = { lat: e.lngLat.lat, lng: e.lngLat.lng };
    if (marker) marker.remove();
    const el = document.createElement("div");
    el.style.cssText = "width:38px;height:38px;background:#1B4FD8;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 1px 5px rgba(0,0,0,.2)";
    el.textContent = CATALOG[sel.value].e;
    marker = new maplibregl.Marker({ element: el }).setLngLat([point.lng, point.lat]).addTo(map);
    document.getElementById("map-hint").textContent = "segnaposto messo — trascina la mappa e ritocca per spostarlo";
  });

  async function createEvent(){
    const note = document.getElementById("note");
    const title = document.getElementById("title").value.trim();
    const place = document.getElementById("place").value.trim();
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    note.className = "note err";
    if (title.length < 3) { note.textContent = "dai un nome all'evento (almeno 3 lettere)."; return; }
    if (!place) { note.textContent = "scrivi il punto di ritrovo."; return; }
    if (!point) { note.textContent = "tocca la mappa per mettere il segnaposto."; return; }
    if (!date || !time) { note.textContent = "scegli giorno e ora."; return; }
    const startAt = new Date(date + "T" + time);
    if (startAt <= new Date()) { note.textContent = "l'evento deve essere nel futuro."; return; }

    const btn = document.getElementById("btn");
    btn.disabled = true; note.className = "note"; note.textContent = "…";
    const maxp = parseInt(document.getElementById("maxp").value, 10);
    const r = await rpc("create_activity", {
      p_sport: sel.value,
      p_activity_kind: "uscita",
      p_title: title,
      p_lat: point.lat, p_lng: point.lng,
      p_meeting_point_text: place,
      p_start_at: startAt.toISOString(),
      p_timezone: "Europe/Rome",
      p_description: document.getElementById("desc").value.trim() || null,
      p_max_participants: Number.isFinite(maxp) ? maxp : null,
      p_visibility: document.getElementById("vis").classList.contains("on") ? "request" : "open"
    });
    btn.disabled = false;
    if (r && r.ok) {
      const newId = await r.json();
      location.href = "evento.html?id=" + newId;
      return;
    }
    const b = r ? await r.json().catch(() => ({})) : {};
    const code = b.message || "";
    note.className = "note err";
    if (code.includes("profile_required")) { location.href = "profilo.html"; return; }
    else if (code.includes("invalid_title")) note.textContent = "dai un nome all'evento (almeno 3 lettere).";
    else if (code.includes("start_in_past")) note.textContent = "l'evento deve essere nel futuro.";
    else note.textContent = "non riesco a creare l'evento, riprova.";
  }
</script>
</body>
</html>
