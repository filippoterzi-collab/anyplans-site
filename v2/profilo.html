<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raccontaci di te · anyplans</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="robots" content="noindex">
<style>
  @font-face{
    font-family:"Bricolage Grotesque";
    src:url("/bricolage-grotesque-latin-800-normal.woff2") format("woff2");
    font-weight:800; font-style:normal; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  :root{
    --blue:#1B4FD8; --blue-lo:#1440AF; --tint:#E9EEFB;
    --ink:#191919; --grey:#6E6E73; --bg:#FBF9F5;
    --round: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Bricolage Grotesque", var(--round);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--round); color:var(--ink); background:var(--bg); line-height:1.5;
       -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column;}
  a{color:inherit; text-decoration:none;}
  header{padding:0 22px;}
  .nav{display:flex; align-items:center; height:64px; max-width:1000px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:800;
         font-size:21px; letter-spacing:-.045em; line-height:1; text-transform:lowercase;}
  .brand img{width:30px; height:30px; display:block;}
  .q{font-size:.92em;}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:24px 22px 64px;}
  .card{width:100%; max-width:420px; background:#fff; border:1.5px solid rgba(25,25,25,.12);
        border-radius:22px; padding:36px; display:flex; flex-direction:column; gap:20px;}
  h1{font-family:var(--display); font-weight:800; letter-spacing:-.045em; line-height:1;
     text-transform:lowercase; font-size:28px;}
  .sub{font-size:15px; color:var(--grey); margin-top:8px;}
  label{font-weight:700; font-size:14px; display:block; margin-bottom:8px;}
  .hint{font-size:12.5px; color:var(--grey); margin-top:6px; line-height:1.4;}
  input{width:100%; background:#fff; border:1.5px solid rgba(25,25,25,.16); border-radius:12px;
        padding:13px 16px; font-size:16px; font-family:var(--round); color:var(--ink);}
  input:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .btn{display:block; width:100%; background:var(--blue); color:#fff; font-weight:700;
       padding:14px 0; border-radius:999px; border:none; cursor:pointer; font-size:16px;
       font-family:var(--round); text-align:center;}
  .btn:hover{background:var(--blue-lo);}
  .btn[disabled]{opacity:.55; cursor:default;}
  .note{font-size:13.5px; color:var(--grey); min-height:1.3em;}
  .note.err{color:#B3261E; font-weight:600;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="/v2/"><img src="/logo.png" alt=""><span>anyplans<span class="q">?</span></span></a>
  </div>
</header>

<main>
  <form class="card" onsubmit="return saveProfile(event)">
    <div>
      <h1>raccontaci di te</h1>
      <p class="sub">ci vuole un attimo, poi sei dentro.</p>
    </div>
    <div>
      <label for="name">come ti chiami?</label>
      <input id="name" type="text" required minlength="2" placeholder="il tuo nome" autocomplete="given-name">
      <p class="hint">è il nome che vedono host e partecipanti.</p>
    </div>
    <div>
      <label for="city">la tua città</label>
      <input id="city" type="text" value="bergamo" autocomplete="address-level2">
    </div>
    <div>
      <label for="birth">la tua data di nascita</label>
      <input id="birth" type="date" required>
      <p class="hint">serve solo per confermare che hai almeno 18 anni. non la mostriamo a nessuno.</p>
    </div>
    <div style="display:flex; align-items:center; gap:16px">
      <div id="pic" onclick="document.getElementById('file').click()"
           style="width:76px; height:76px; border:2px dashed rgba(27,79,216,.5); border-radius:999px;
                  display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;
                  background-size:cover; background-position:center;">
        <svg id="pic-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B4FD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8 L7 8 L9 5.5 L15 5.5 L17 8 L20 8 L20 18.5 L4 18.5 Z"/><circle cx="12" cy="13" r="3.2"/></svg>
      </div>
      <div>
        <div style="font-weight:700; font-size:14.5px">aggiungi una foto</div>
        <div class="hint" style="margin-top:2px">se vuoi: aiuta gli altri a riconoscerti quando vi trovate.</div>
      </div>
      <input id="file" type="file" accept="image/*" hidden onchange="pickPhoto(this)">
    </div>
    <button class="btn" id="btn" type="submit">entra su anyplans</button>
    <p class="note" id="note"></p>
  </form>
</main>

<script>
  const SB_URL = "https://uudccbzihhgoeaevkewr.supabase.co";
  const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1ZGNjYnppaGhnb2VhZXZrZXdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzk0NzEsImV4cCI6MjEwMTk1NTQ3MX0.OHJC3vmT8eRLczFkH0QdZybbjudDfSi4VEX8Mc22ABQ";

  let session = null;
  try { session = JSON.parse(localStorage.getItem("anyplans_session")); } catch (_) {}
  if (!session) { try { session = JSON.parse(sessionStorage.getItem("anyplans_session")); } catch (_) {} }
  if (!session || !session.access_token) location.replace("login.html");

  function logout(){
    try { localStorage.removeItem("anyplans_session"); } catch (_) {}
    try { sessionStorage.removeItem("anyplans_session"); } catch (_) {}
    location.href = "login.html";
  }

  async function refreshSession(){
    try {
      const r = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST", headers: {"apikey": SB_ANON, "Content-Type": "application/json"},
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!r.ok) return false;
      const b = await r.json();
      session.access_token = b.access_token; session.refresh_token = b.refresh_token;
      try { localStorage.setItem("anyplans_session", JSON.stringify(session)); } catch (_) {}
      return true;
    } catch (_) { return false; }
  }

  async function rpc(name, body, retry = true){
    const r = await fetch(SB_URL + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: {"apikey": SB_ANON, "Content-Type": "application/json",
                "Authorization": "Bearer " + session.access_token},
      body: JSON.stringify(body || {})
    });
    if (r.status === 401 && retry && session.refresh_token) {
      if (await refreshSession()) return rpc(name, body, false);
      logout(); return null;
    }
    return r;
  }

  // ?edit=1 = modifica del profilo esistente; altrimenti chi ha già il profilo va agli eventi
  const editMode = new URLSearchParams(location.search).get("edit") === "1";
  rpc("my_profile").then(async r => {
    if (!r || !r.ok) return;
    const rows = await r.json().catch(() => []);
    const me = rows[0];
    if (me && me.display_name && !editMode) {
      let next = "eventi.html";
      try { next = sessionStorage.getItem("anyplans_next") || next; sessionStorage.removeItem("anyplans_next"); } catch (_) {}
      location.replace(next);
      return;
    }
    if (me && editMode) {
      document.querySelector("h1").textContent = "il tuo profilo";
      document.querySelector(".sub").textContent = "cambia quello che vuoi e salva.";
      document.getElementById("btn").textContent = "salva le modifiche";
      document.getElementById("name").value = me.display_name || "";
      if (me.birth_date) document.getElementById("birth").value = me.birth_date;
    }
  });

  let avatarBlob = null;
  function pickPhoto(input){
    const f = input.files && input.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      const c = document.createElement("canvas"); c.width = 512; c.height = 512;
      c.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 512, 512);
      c.toBlob(b => {
        avatarBlob = b;
        const pic = document.getElementById("pic");
        pic.style.backgroundImage = "url(" + c.toDataURL("image/jpeg", 0.8) + ")";
        pic.style.borderStyle = "solid";
        document.getElementById("pic-icon").style.display = "none";
      }, "image/jpeg", 0.85);
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  }

  function myUid(){
    try { return JSON.parse(atob(session.access_token.split(".")[1])).sub; } catch (_) { return null; }
  }

  async function uploadAvatar(){
    try {
      const uid = myUid(); if (!uid) return;
      const path = uid + "/avatar.jpg";
      const r = await fetch(SB_URL + "/storage/v1/object/avatars/" + path, {
        method: "POST",
        headers: {"apikey": SB_ANON, "Authorization": "Bearer " + session.access_token,
                  "Content-Type": "image/jpeg", "x-upsert": "true"},
        body: avatarBlob
      });
      if (r.ok) {
        const url = SB_URL + "/storage/v1/object/public/avatars/" + path + "?v=" + Date.now();
        await rpc("update_profile", { p_avatar_url: url });
      }
    } catch (_) { /* la foto è opzionale: se fallisce si va avanti */ }
  }

  async function saveProfile(e){
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const city = document.getElementById("city").value.trim().toLowerCase();
    const birth = document.getElementById("birth").value;
    const btn = document.getElementById("btn");
    const note = document.getElementById("note");
    btn.disabled = true; note.textContent = "…"; note.className = "note";
    try {
      const r = await rpc("upsert_profile", { p_display_name: name, p_birth_date: birth });
      if (!r || !r.ok) {
        const b = r ? await r.json().catch(() => ({})) : {};
        const code = b.message || "";
        note.className = "note err";
        if (code.includes("must_be_adult")) note.textContent = "anyplans è solo per maggiorenni (18+).";
        else if (code.includes("invalid_name")) note.textContent = "il nome deve avere almeno 2 lettere.";
        else note.textContent = "non riesco a salvare, riprova.";
        btn.disabled = false;
        return false;
      }
      if (city) await rpc("update_profile", { p_base_city: city });
      if (avatarBlob) await uploadAvatar();
      let next = "eventi.html";
      try { next = sessionStorage.getItem("anyplans_next") || next; sessionStorage.removeItem("anyplans_next"); } catch (_) {}
      location.href = next;
    } catch (_) {
      note.className = "note err";
      note.textContent = "non riesco a raggiungere il server, riprova.";
      btn.disabled = false;
    }
    return false;
  }
</script>
</body>
</html>
