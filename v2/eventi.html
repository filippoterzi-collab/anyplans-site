<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eventi a bergamo · anyplans</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
  @font-face{
    font-family:"Bricolage Grotesque";
    src:url("/bricolage-grotesque-latin-800-normal.woff2") format("woff2");
    font-weight:800; font-style:normal; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  :root{
    --blue:#1B4FD8; --blue-lo:#1440AF; --tint:#E9EEFB;
    --ink:#191919; --grey:#6E6E73; --bg:#FBF9F5;
    --round: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Bricolage Grotesque", var(--round);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--round); color:var(--ink); background:var(--bg); line-height:1.5;
       -webkit-font-smoothing:antialiased; height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  a{color:inherit; text-decoration:none;}
  .display{font-family:var(--display); font-weight:800; letter-spacing:-.045em; line-height:1;
           text-transform:lowercase;}
  .q{font-size:.92em;}

  header{padding:0 24px; flex-shrink:0;}
  .nav{display:flex; align-items:center; gap:24px; height:60px;}
  .brand{display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:800;
         font-size:20px; letter-spacing:-.045em; line-height:1; text-transform:lowercase;}
  .brand img{width:28px; height:28px; display:block;}
  .nav .lnk{font-weight:600; font-size:15px; color:var(--grey);}
  .nav .lnk.on{font-weight:700; color:var(--blue);}
  .nav-right{margin-left:auto; display:flex; align-items:center; gap:12px;}
  .iconbtn{width:36px; height:36px; border-radius:999px; background:var(--tint); border:none;
           cursor:pointer; display:flex; align-items:center; justify-content:center;
           font-weight:800; font-size:14px; color:var(--blue); font-family:var(--round);}

  .topbar{padding:4px 24px 12px; display:flex; flex-direction:column; gap:12px; flex-shrink:0;}
  .titlerow{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .titlerow h1{font-size:30px;}
  .titlerow h1 span{color:var(--blue);}
  .count{font-weight:600; font-size:13.5px; color:var(--grey); margin-left:auto;}
  .search{display:flex; align-items:center; gap:9px; background:#fff;
          border:1.5px solid rgba(25,25,25,.16); border-radius:999px; padding:9px 15px; flex-shrink:0;}
  .search input{border:none; outline:none; font-size:14px; font-family:var(--round);
                background:transparent; color:var(--ink); width:100%;}
  .chip{background:#fff; border:1.5px solid rgba(25,25,25,.14); color:var(--ink); font-weight:600;
        font-size:13.5px; padding:9px 14px; border-radius:999px; cursor:pointer;
        font-family:var(--round); flex-shrink:0; white-space:nowrap;}
  .chip.on{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700;}
  /* ── ricerca + filtri (fl-) ─────────────────────────────── */
  .fl-bar{display:flex; align-items:center; gap:10px;}
  .fl-bar .search{flex:1 1 260px; min-width:200px; max-width:440px;}
  .fl-days{display:flex; gap:8px; flex-shrink:0;}
  .fl-days .chip{height:40px; padding:0 14px; display:inline-flex; align-items:center;}
  .fl-btn{display:inline-flex; align-items:center; gap:7px; height:40px; padding:0 14px; border-radius:999px;
          background:var(--tint); color:var(--blue); border:none; font:700 14px var(--round);
          cursor:pointer; white-space:nowrap; flex-shrink:0;
          transition:background .15s ease, color .15s ease, transform .12s ease;}
  .fl-btn svg{width:16px; height:16px; stroke:currentColor;}
  .fl-btn:hover{background:#DCE4F8;}
  .fl-btn:active{transform:scale(.96);}
  .fl-btn.on{background:var(--blue); color:#fff;}
  .fl-btn.on:hover{background:var(--blue-lo);}
  .fl-active{display:none; flex-wrap:wrap; align-items:center; gap:8px; margin-top:-2px;}
  .fl-active.has{display:flex;}
  .fl-pill{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 8px 0 13px; border-radius:999px;
           background:var(--tint); color:var(--blue); border:none; font:700 13.5px var(--round); cursor:pointer;
           transition:background .15s ease;}
  .fl-pill b{width:20px; height:20px; border-radius:999px; display:flex; align-items:center; justify-content:center;
             font-weight:800; font-size:15px; line-height:1;}
  .fl-pill:hover b{background:rgba(27,79,216,.14);}
  .fl-clear{background:none; border:none; height:36px; padding:0 4px; color:var(--grey); font:600 13.5px var(--round);
            text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
  .fl-clear:hover{color:var(--ink);}
  .fl-pill[data-kind="day"]{display:none;}
  /* ── modale filtri ──────────────────────────────────────── */
  .fl-overlay{position:fixed; inset:0; z-index:60; background:rgba(25,25,25,.45);
              display:flex; align-items:center; justify-content:center; padding:24px;
              opacity:0; visibility:hidden; transition:opacity .15s ease, visibility 0s linear .15s;}
  .fl-overlay.fl-open{opacity:1; visibility:visible; transition:opacity .15s ease;}
  .fl-modal{width:100%; max-width:480px; max-height:calc(100vh - 48px); background:#fff; border-radius:20px;
            display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.18);
            transform:scale(.98); transition:transform .15s ease;}
  .fl-open .fl-modal{transform:none;}
  .fl-handle{display:none;}
  .fl-head{display:flex; align-items:center; justify-content:space-between; padding:20px 24px 10px; flex-shrink:0;}
  .fl-head h2{font-size:24px;}
  .fl-x{width:44px; height:44px; margin:-8px -12px -8px 0; border:none; border-radius:999px; background:transparent;
        color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;
        transition:background .15s ease;}
  .fl-x:hover{background:var(--tint);}
  .fl-body{flex:1; min-height:0; overflow-y:auto; padding:6px 24px 10px; display:flex; flex-direction:column; gap:22px;}
  .fl-sec h3{font-size:15px; font-weight:800; margin-bottom:10px;}
  .fl-sec p{font-size:13px; color:var(--grey); margin:-8px 0 10px;}
  .fl-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .fl-grid.days{display:flex; gap:8px;}
  .fl-grid.days .chip{flex:1 1 0; min-width:0;}
  .fl-modal .chip{height:48px; width:100%; padding:0 14px; border-radius:12px; font-size:15px;
                  display:flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap;}
  .fl-modal .chip:hover{border-color:var(--ink);}
  .fl-modal .chip.on{background:var(--blue); border-color:var(--blue); color:#fff;}
  .fl-modal .chip[data-cat=""]{grid-column:1 / -1;}
  .fl-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 24px;
           border-top:1px solid rgba(25,25,25,.10); background:#fff; flex-shrink:0;}
  .fl-reset{background:none; border:none; height:44px; padding:0 4px; color:var(--ink); font:700 14.5px var(--round);
            text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
  .fl-reset:disabled{color:var(--grey); text-decoration:none; cursor:default;}
  .fl-show{height:48px; min-width:170px; padding:0 22px; border-radius:999px; background:var(--blue); color:#fff;
           border:none; font:700 15px var(--round); cursor:pointer; transition:background .15s ease, transform .12s ease;}
  .fl-show:hover{background:var(--blue-lo);}
  .fl-show:active{transform:scale(.98);}
  .fl-show.zero{background:rgba(25,25,25,.08); color:var(--grey);}
  body.fl-lock{overflow:hidden;}
  @media (prefers-reduced-motion:reduce){ .fl-overlay, .fl-modal{transition:none;} }
  .ev .m .ha{display:inline-block; width:18px; height:18px; border-radius:999px; background:var(--blue);
             background-size:cover; background-position:center; vertical-align:-4px; margin-right:3px;}

  .split{flex:1; display:flex; min-height:0;}
  .list{width:46%; max-width:640px; overflow-y:auto; padding:6px 20px 40px 24px;
        display:flex; flex-direction:column; gap:14px;}
  .day{display:flex; align-items:center; gap:8px; margin-top:6px;}
  .day .dot{width:8px; height:8px; border-radius:999px; background:rgba(25,25,25,.25);}
  .day.today .dot{background:var(--blue);}
  .day b{font-size:15px;}
  .day span{font-weight:600; font-size:13px; color:var(--grey);}
  .ev{display:flex; align-items:center; gap:14px; background:#fff;
      border:1.5px solid rgba(25,25,25,.10); border-radius:16px; padding:14px 16px; cursor:pointer;}
  .ev:hover, .ev.on{border-color:var(--blue);}
  .ev .tile{width:52px; height:52px; background:var(--tint); border-radius:13px; display:flex;
            align-items:center; justify-content:center; font-size:26px; flex-shrink:0;}
  .ev .time{font-size:12.5px; font-weight:700; color:var(--blue);}
  .ev .t{font-weight:700; font-size:15px;} .ev a.t:hover{color:var(--blue);}
  .ev .m{font-size:12.5px; color:var(--grey);}
  .ev .go{margin-left:auto; font-weight:700; font-size:13.5px; color:var(--blue);
          white-space:nowrap; background:none; border:none; cursor:pointer; font-family:var(--round);}
  .ev .go.ok{color:var(--ink);}
  .ev .go.wait{color:var(--grey);}
  .empty{color:var(--grey); font-size:14.5px; padding:24px 4px;}
  .sk{height:84px; border-radius:16px; background:linear-gradient(90deg,#F1EFE9 25%,#E9E6DE 50%,#F1EFE9 75%);
      background-size:200% 100%; animation:sk 1.2s ease-in-out infinite;}
  @keyframes sk{from{background-position:200% 0} to{background-position:-200% 0}}

  #map{flex:1; border-radius:22px 0 0 0; min-height:0;}
  .pin{width:38px; height:38px; background:#fff; border:1.5px solid rgba(25,25,25,.2);
       border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:17px;
       box-shadow:0 1px 4px rgba(0,0,0,.12); cursor:pointer;}
  .pin.on{background:var(--blue); border-color:var(--blue);}
  .pin.today{box-shadow:0 0 0 2.5px var(--blue), 0 1px 4px rgba(0,0,0,.12);}
  .maplibregl-popup-content{border-radius:14px; font-family:var(--round); padding:12px 14px;
       box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .pop .t{font-weight:700; font-size:14px; color:var(--ink);}
  .pop .m{font-size:12px; color:var(--grey); margin-top:2px;}

  #maptoggle{display:none;}
  @media (max-width:700px){
    body{overflow:auto; height:auto;}
    .nav .lnk{display:none;}
    .nav-right a, .nav-right .iconbtn[title]{display:none;}
    .nav-right #avatar, .nav-right #bell{display:flex;}
    .nav-right #nav-reg{display:inline-block;}
    .topbar{padding:4px 18px 10px;}
    .fl-bar{gap:8px; flex-wrap:wrap;}
    .fl-bar .search{max-width:none; min-width:0; padding:11px 15px; flex:1 1 200px;}
    .fl-days{order:3; width:100%; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
    .fl-days::-webkit-scrollbar{display:none;}
    .fl-days .chip{flex-shrink:0;}
    .fl-btn{height:44px; padding:0 13px;}
    .fl-pill, .fl-clear{height:40px;}
    .fl-overlay{align-items:flex-end; padding:0;}
    .fl-modal{max-width:none; height:calc(100dvh - 24px); max-height:none; border-radius:22px 22px 0 0;
              box-shadow:none; transform:translateY(100%);}
    .fl-open .fl-modal{transform:none;}
    .fl-handle{display:block; width:36px; height:4px; border-radius:999px; background:rgba(25,25,25,.18); margin:10px auto 0;}
    .fl-head{padding:8px 20px 8px;}
    .fl-body{padding:4px 20px 16px;}
    .fl-foot{position:sticky; bottom:0; padding:12px 20px calc(12px + env(safe-area-inset-bottom));}
    .fl-show{flex:1; min-width:0;}
    .fl-grid.days .chip{font-size:14px; padding:0 8px;}
    .titlerow h1{font-size:24px;}
    .split{flex-direction:column;}
    #map{display:none; height:calc(100vh - 330px); flex:none; border-radius:16px; margin:0 18px;}
    .list{width:100%; max-width:none; padding:12px 18px 90px;}
    body.showmap #map{display:block;}
    body.showmap .list{display:none;}
    #maptoggle{display:flex; align-items:center; gap:7px; position:fixed; left:50%;
      transform:translateX(-50%); bottom:84px; z-index:40; background:var(--ink); color:#fff;
      font-weight:700; font-size:14px; padding:13px 22px; border-radius:999px; border:none;
      cursor:pointer; font-family:var(--round); box-shadow:0 4px 16px rgba(0,0,0,.22);}
  }

  /* ux: transizioni e feedback al tocco */
  .btn, .chip, .ev, .iconbtn, .card, .city, .qz-chip, .place-item, .toggle-row{
    transition: transform .12s ease, box-shadow .12s ease, background .15s ease,
                border-color .15s ease, color .15s ease;}
  .btn:active, .chip:active, .iconbtn:active, .qz-chip:active{transform:scale(.96);}
  .ev:hover{box-shadow:0 4px 16px rgba(25,25,25,.07); transform:translateY(-1px);}
  .card:hover, .city:hover{box-shadow:0 4px 14px rgba(25,25,25,.06);}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--blue); outline-offset:2px;}
</style>
</head>
<body>

<header></header>

<div class="topbar">
  <div class="titlerow">
    <h1 class="display">eventi a <span>bergamo</span></h1>
    <span class="count" id="count"></span>
  </div>
  <div class="fl-bar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg>
      <input id="q" placeholder="cerca un evento: ceramica, corsa, cucina…" oninput="render()" aria-label="cerca un evento">
    </div>
    <div class="fl-days" id="fl-days">
      <button class="chip day-chip" data-day="oggi" aria-pressed="false" onclick="setDay(this)">oggi</button>
      <button class="chip day-chip" data-day="domani" aria-pressed="false" onclick="setDay(this)">domani</button>
      <button class="chip day-chip" data-day="weekend" aria-pressed="false" onclick="setDay(this)">fine settimana</button>
    </div>
    <button class="fl-btn" id="fbtn" onclick="openFilters()" aria-haspopup="dialog" aria-controls="fl">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg>
      <span id="fbtn-label">filtri</span>
    </button>
  </div>
  <div class="fl-active" id="fl-active" aria-live="polite"></div>
</div>
</div>

<div class="fl-overlay" id="fl" role="dialog" aria-modal="true" aria-labelledby="fl-title" onclick="if(event.target===this) closeFilters()">
  <div class="fl-modal">
    <div class="fl-handle" aria-hidden="true"></div>
    <div class="fl-head">
      <h2 class="display" id="fl-title">filtri</h2>
      <button class="fl-x" onclick="closeFilters()" aria-label="chiudi">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="fl-body">
      <section class="fl-sec" aria-labelledby="fl-h-day">
        <h3 id="fl-h-day">quando</h3>
        <p>scegli un giorno. se non scegli niente li vedi tutti.</p>
        <div class="fl-grid days" id="fl-day"></div>
      </section>
      <section class="fl-sec" aria-labelledby="fl-h-cat">
        <h3 id="fl-h-cat">che tipo di evento</h3>
        <div class="fl-grid" id="fl-cat">
          <button class="chip on" data-cat="" aria-pressed="true" onclick="setCat(this)">tutti i tipi</button>
          <button class="chip" data-cat="sport" aria-pressed="false" onclick="setCat(this)">🏃 sport</button>
          <button class="chip" data-cat="cucina" aria-pressed="false" onclick="setCat(this)">🍳 cucina</button>
          <button class="chip" data-cat="creatività" aria-pressed="false" onclick="setCat(this)">🏺 creatività</button>
          <button class="chip" data-cat="giardinaggio" aria-pressed="false" onclick="setCat(this)">🌱 giardinaggio</button>
          <button class="chip" data-cat="cultura" aria-pressed="false" onclick="setCat(this)">🎪 cultura</button>
          <button class="chip" data-cat="benessere" aria-pressed="false" onclick="setCat(this)">🧘 benessere</button>
        </div>
      </section>
    </div>
    <div class="fl-foot">
      <button class="fl-reset" id="fl-reset" onclick="clearFilters()" disabled>cancella tutto</button>
      <button class="fl-show" id="fl-show" onclick="closeFilters()">mostra <span id="fl-count">…</span></button>
    </div>
  </div>
</div>

<button id="maptoggle" onclick="toggleMap()">🗺️ mappa</button>

<div class="split">
  <div class="list" id="list"></div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="app.js?v=1788507376"></script>
<script>
  // sessione passata via #s= quando il browser blocca lo storage (safari su file://)
  if (!session && location.hash.startsWith("#s=")) {
    try { saveSession(JSON.parse(decodeURIComponent(location.hash.slice(3)))); history.replaceState(null, "", location.pathname); } catch (_) {}
  }
  // deciso 04/09: prima ci si registra (basta l'email), poi si vede la mappa
  requireLogin();
  mountNav("eventi");
  const logged = !!(session && session.access_token);
  if (!logged) {
    document.getElementById("avatar").parentElement.hidden = true;
    const bell = document.getElementById("bell"); if (bell) bell.style.display = "none";
    const reg = document.createElement("a"); reg.href = "login.html"; reg.id = "nav-reg";
    reg.style.cssText = "background:var(--blue); color:#fff; font-weight:700; font-size:13.5px; padding:9px 16px; border-radius:999px; white-space:nowrap";
    reg.textContent = "registrati"; reg.onclick = () => { try { sessionStorage.setItem("anyplans_next", "eventi.html"); } catch (_) {} };
    document.querySelector(".nav-right").prepend(reg);
  }
  if (logged) {
    document.getElementById("avatar").textContent = (session.email || "?")[0].toLowerCase();
    document.getElementById("menu-email").textContent = session.email || "";
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#menu") && e.target.id !== "avatar") document.getElementById("menu").hidden = true;
    });
  }
  mountTabbar("eventi");
  if (!logged) document.querySelectorAll("#tabbar a").forEach(a => { if (!a.getAttribute("href").includes("eventi.html")) a.onclick = () => { try { sessionStorage.setItem("anyplans_next", a.getAttribute("href")); } catch (_) {} }; });

  // categoria del sito per ogni slug non sportivo; tutto il resto è "sport"
  const CAT_BY_SLUG = { cooking:"cucina", ceramics:"creatività", painting:"creatività",
                        gardening:"giardinaggio", festival:"cultura", yoga:"benessere" };
  // parole con cui la gente cerca ogni attività (il titolo da solo non basta: "corsa" vs "corro 10k")
  const SEARCH_WORDS = {
    running: "corsa correre corro run running jogging km parco allenamento",
    trail: "trail corsa montagna sentiero sentieri running mountain",
    hyrox: "hyrox palestra gara fitness workout crossfit",
    walking: "camminata passeggiata camminare walk walking passeggio piedi",
    cycling: "bici bicicletta ciclismo pedalare pedalata giro bike cycling ride road",
    mtb: "mtb gravel bici montagna mountain bike ebike e-bike ciclismo",
    moto: "moto motociclette motociclismo giro motorbike ride",
    hiking: "escursione escursionismo trekking hiking hike camminata montagna gita sentiero rifugio cima trek",
    climbing: "arrampicata scalata scalare climbing boulder bouldering falesia parete corda montagna",
    skitouring: "scialpinismo sci alpinismo montagna neve ski touring",
    gym: "palestra crossfit allenamento workout gym fitness pesi",
    yoga: "yoga pilates benessere rilassamento meditazione stretching respiro wellness",
    football: "calcio calcetto pallone partita football soccer",
    basketball: "basket pallacanestro partita basketball canestro",
    volleyball: "volley pallavolo beach partita volleyball",
    tennis: "tennis racchetta partita",
    padel: "padel racchetta partita paddle",
    swimming: "nuoto piscina nuotare swim swimming lago mare",
    surf: "surf sup tavola paddle board surfing onde",
    paddling: "canoa kayak pagaia canoe paddling fiume lago rafting",
    skiing: "sci neve sciare ski skiing pista montagna",
    snowboard: "snowboard neve tavola snow",
    skating: "pattinaggio pattini skate skating rollerblade ghiaccio",
    ceramics: "ceramica argilla tornio corso creativo pottery clay laboratorio manuale",
    cooking: "cucina cucinare corso pasta chef cooking cena pranzo ricetta food mangiare cibo aperitivo",
    painting: "pittura disegno arte corso creativo painting drawing art acquerello quadro laboratorio",
    gardening: "giardinaggio orto volontariato verde gardening garden piante natura pulizia ambiente",
    festival: "festa sagra festival evento concerto paese party musica live serata fiera mercato"
  };
  // parole simili: "corse" trova "corsa", "scalate" trova "scalata" (si confronta anche la radice)
  const stem = w => w.length > 4 ? w.replace(/(ando|endo|are|ere|ire|ate|ata|ato|ati|ing|s|e|a|o|i)$/, "") : w;
  const hit = (hay, w) => hay.includes(w) || (w.length > 3 && hay.includes(stem(w)));
  const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  let EVENTS = [];

  async function checkProfile(){
    const r = await rpc("my_profile");
    if (!r || !r.ok) return; // il feed funziona comunque
    const rows = await r.json().catch(() => []);
    if (!rows.length || !rows[0].display_name) location.replace("profilo.html");
    else document.getElementById("menu-name").textContent = rows[0].display_name;
  }

  async function loadEvents(){
    const list = document.getElementById("list");
    list.innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    const r = await rpc("feed_activities", { lat: 45.698, lng: 9.670, radius_m: 50000 });
    if (!r || !r.ok) { list.innerHTML = '<div class="empty">non riesco a caricare gli eventi. ricarica la pagina.</div>'; return; }
    const rows = await r.json();
    EVENTS = rows.map(x => ({
      id: x.id,
      emoji: x.emoji || "📍",
      cat: CAT_BY_SLUG[x.sport] || "sport",
      slug: x.sport,
      title: x.title,
      host: x.host_name || null,
      hostAvatar: x.host_avatar || null,
      place: x.meeting_point_text || "zona indicativa",
      when: new Date(x.start_at),
      going: Number(x.going_count) || 0,
      my: x.my_status,
      mine: x.is_mine,
      request: x.visibility === "request",
      price: x.price_cents ?? null,
      lat: x.lat, lng: x.lng
    }));
    buildMarkers();
    render();
  }

  // mappa: stesso stile open source dell'app android (maplibre + openfreemap "liberty")
  const map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: [9.665, 45.7031],
    zoom: 12.3
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }));

  let markers = {};
  function buildMarkers(){
    Object.values(markers).forEach(m => m.remove());
    markers = {};
    EVENTS.forEach(ev => {
      const el = document.createElement("div");
      el.className = "pin" + (dayLabel(ev.when) === "oggi" ? " today" : ""); el.id = "pin-" + ev.id; el.textContent = ev.emoji;
      const popup = new maplibregl.Popup({ offset: 22, closeButton: false })
        .setHTML(`<div class="pop"><div class="t">${esc(ev.title)}</div><div class="m">${dayLabel(ev.when)} · ${timeStr(ev.when)} · ${relTime(ev.when)} · ${esc(ev.place)}${ev.price > 0 ? " · " + esc(fmtPrice(ev.price)) : ""}</div></div>`);
      const mk = new maplibregl.Marker({ element: el }).setLngLat([ev.lng, ev.lat]).setPopup(popup).addTo(map);
      el.addEventListener("click", () => highlight(ev.id, false));
      markers[ev.id] = mk;
    });
  }

  // lista
  let cat = "", day = "";
  const mobileFilters = window.matchMedia("(max-width:700px)");
  const fl = document.getElementById("fl");
  const isOpen = () => fl.classList.contains("fl-open");
  // chip giorno: in riga su computer, nella modale su telefono o quando la modale è aperta
  function placeChips(){
    const dest = isOpen() ? document.getElementById("fl-day") : document.getElementById("fl-days");
    document.querySelectorAll(".day-chip").forEach(c => dest.appendChild(c));
  }
  function openFilters(){
    fl.classList.add("fl-open"); document.body.classList.add("fl-lock");
    placeChips(); fl.querySelector(".fl-x").focus();
  }
  function closeFilters(){
    if (!isOpen()) return;
    fl.classList.remove("fl-open"); document.body.classList.remove("fl-lock");
    placeChips(); document.getElementById("fbtn").focus();
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeFilters(); });
  function clearFilters(){
    day = ""; cat = "";
    document.querySelectorAll(".day-chip").forEach(c => { c.classList.remove("on"); c.setAttribute("aria-pressed", "false"); });
    document.querySelectorAll(".chip[data-cat]").forEach(c => { const on = c.dataset.cat === ""; c.classList.toggle("on", on); c.setAttribute("aria-pressed", String(on)); });
    updateFbtn(); render();
  }
  function updateFbtn(){
    const n = (day ? 1 : 0) + (cat ? 1 : 0);
    document.getElementById("fbtn-label").textContent = n ? "filtri · " + n : "filtri";
    document.getElementById("fbtn").classList.toggle("on", n > 0);
    document.getElementById("fl-reset").disabled = !n;
    const act = document.getElementById("fl-active");
    let html = "";
    if (day) html += `<button class="fl-pill" data-kind="day" onclick="setDay(document.querySelector('.day-chip.on'))">${esc(document.querySelector(".day-chip.on").textContent)} <b>×</b></button>`;
    if (cat) html += `<button class="fl-pill" data-kind="cat" onclick="setCat(document.querySelector('.chip[data-cat=\'\']'))">${esc(document.querySelector(".chip[data-cat].on").textContent)} <b>×</b></button>`;
    if (n) html += `<button class="fl-clear" onclick="clearFilters()">cancella tutto</button>`;
    act.innerHTML = cat ? html : ""; act.classList.toggle("has", !!cat);
  }
  function setCat(btn){
    cat = btn.dataset.cat;
    document.querySelectorAll(".chip[data-cat]").forEach(c => { const on = c === btn; c.classList.toggle("on", on); c.setAttribute("aria-pressed", String(on)); });
    updateFbtn(); render();
  }
  function setDay(btn){
    day = day === btn.dataset.day ? "" : btn.dataset.day;
    document.querySelectorAll(".day-chip").forEach(c => { const on = c.dataset.day === day; c.classList.toggle("on", on); c.setAttribute("aria-pressed", String(on)); });
    updateFbtn(); render();
  }
  placeChips();
  function inDay(d){
    if (!day) return true;
    const lbl = dayLabel(d);
    if (day === "weekend") {
      const wd = d.getDay(), diff = (d - Date.now()) / 86400000;
      return (wd === 0 || wd === 6) && diff < 7;
    }
    return lbl === day;
  }

  function stateBtn(e){
    if (e.mine) return ["ok", "lo organizzi tu"];
    if (e.my === "going") return ["ok", "ci vado ✓"];
    if (e.my === "requested") return ["wait", "aspetto l'ok"];
    return ["", e.request ? "chiedo di entrare →" : "ci sono →"];
  }

  function render(){
    const q = document.getElementById("q").value.trim().toLowerCase();
    const list = document.getElementById("list");
    const evs = EVENTS
      .filter(e => !cat || e.cat === cat)
      .filter(e => inDay(e.when))
      .filter(e => {
        if (!q) return true;
        const hay = norm([e.title, e.host, e.place, e.cat, SEARCH_WORDS[e.slug] || ""].join(" "));
        return norm(q).split(/\s+/).every(w => hit(hay, w));
      })
      .sort((a, b) => a.when - b.when);

    document.getElementById("count").textContent = evs.length + (evs.length === 1 ? " evento" : " eventi") + " in programma";
    const show = document.getElementById("fl-show");
    show.classList.toggle("zero", !evs.length);
    show.innerHTML = evs.length ? 'mostra <span id="fl-count">' + (evs.length === 1 ? "1 evento" : evs.length + " eventi") + "</span>" : "nessun evento";
    EVENTS.forEach(e => { const visible = evs.includes(e); markers[e.id].getElement().style.opacity = visible ? "1" : "0.25"; });

    if (!evs.length) {
      const CATN = { sport:"sport", cucina:"cucina", "creatività":"creatività", giardinaggio:"giardinaggio", cultura:"cultura", benessere:"benessere" };
      const dayTxt = day === "weekend" ? "nel fine settimana" : day;
      const pub = '<a href="crea.html" style="color:var(--blue); font-weight:700">pubblica tu un evento</a>';
      let msg;
      if (day || cat) msg = "niente " + (day ? dayTxt + " " : "") + (cat ? "di " + CATN[cat] : "") + '. <a href="#" onclick="clearFilters(); return false" style="color:var(--blue); font-weight:700">togli i filtri</a> oppure ' + pub + ".";
      else if (q) msg = 'nessun evento per "' + esc(q) + '". prova un\'altra parola, oppure ' + pub + ".";
      else msg = 'per ora non c\'è nessun evento. <a href="crea.html" style="color:var(--blue); font-weight:700">pubblica tu il primo</a>.';
      list.innerHTML = '<div class="empty">' + msg + "</div>"; return;
    }

    let html = "", lastDay = "";
    evs.forEach(e => {
      const dk = dayKey(e.when);
      if (dk !== lastDay) {
        lastDay = dk;
        const isToday = dayLabel(e.when) === "oggi";
        html += `<div class="day${isToday ? " today" : ""}"><span class="dot"></span><b>${dayLabel(e.when)}</b><span>${daySub(e.when)}</span></div>`;
      }
      const [cls, label] = stateBtn(e);
      html += `<div class="ev" id="ev-${e.id}" onclick="location.href='evento.html?id=${e.id}'" onmouseenter="highlight('${e.id}', false)">
        <div class="tile">${e.emoji}</div>
        <div>
          <div class="time">${timeStr(e.when)} · ${relTime(e.when)}</div>
          <a class="t" href="evento.html?id=${e.id}" onclick="event.stopPropagation()" style="display:block">${esc(e.title)}</a>
          <div class="m">${e.host ? (e.hostAvatar ? `<span class="ha" style="background-image:url('${esc(e.hostAvatar)}')"></span>` : "") + "di " + esc(e.host) : "da un altro sito"} · ${esc(e.place)} · ${goingTxt(e.going)}${e.request ? " · con approvazione" : ""}${e.price > 0 ? ' · <b style="font-weight:600; color:var(--ink)">' + esc(fmtPrice(e.price)) + "</b>" : ""}</div>
        </div>
        <button class="go ${cls}" onclick="event.stopPropagation(); join('${e.id}')">${label}</button>
      </div>`;
    });
    list.innerHTML = html;
  }

  function highlight(id, pan){
    document.querySelectorAll(".ev").forEach(x => x.classList.remove("on"));
    document.querySelectorAll(".pin").forEach(x => x.classList.remove("on"));
    const row = document.getElementById("ev-" + id);
    const pin = document.getElementById("pin-" + id);
    if (row) { row.classList.add("on"); row.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    if (pin) pin.classList.add("on");
    const ev = EVENTS.find(e => e.id === id);
    if (pan) {
      map.easeTo({ center: [ev.lng, ev.lat] });
      Object.values(markers).forEach(m => { const p = m.getPopup(); if (p && p.isOpen()) m.togglePopup(); });
      markers[id].togglePopup();
    }
  }

  function askLogin(id){
    try { sessionStorage.setItem("anyplans_next", "evento.html?id=" + id + "&join=1"); } catch (_) {}
    toast("per iscriverti serve un account: è gratis, ci vuole un minuto.");
    setTimeout(() => location.href = "login.html", 900);
  }
  async function join(id){
    if (!logged) return askLogin(id);
    const e = EVENTS.find(x => x.id === id);
    if (e.mine) { location.href = "evento.html?id=" + id; return; }
    const leaving = e.my === "going" || e.my === "requested";
    if (leaving && e.my === "requested" && !confirm("vuoi annullare la richiesta?")) return;
    if (!leaving) {
      // se l'host ha messo delle domande si risponde nella pagina dell'evento
      const rq = await rpc("get_activity_questions", { p_activity_id: id });
      const qs = rq && rq.ok ? await rq.json().catch(() => []) : [];
      if (qs.length) { location.href = "evento.html?id=" + id + "&join=1"; return; }
    }
    let r;
    if (leaving) r = await rpc("join_activity", { p_activity_id: id, p_status: "left" });
    else if (e.request) r = await rpc("request_to_join", { p_activity_id: id });
    else r = await rpc("join_activity", { p_activity_id: id, p_status: "going" });
    if (r && r.ok) {
      if (leaving) { if (e.my === "going") e.going -= 1; e.my = "left"; }
      else if (e.request) { e.my = "requested"; toast("richiesta mandata. quando chi organizza dice sì, ti avvisiamo."); track("join_request"); }
      else { e.my = "going"; e.going += 1; toast("fatto, ci vai! il tuo nome è nella lista dei partecipanti."); track("join"); }
      render();
      return;
    }
    let msg = "non ha funzionato, riprova.";
    try {
      const b = r ? await r.json() : {};
      const code = b.message || "";
      if (code.includes("profile_required")) { location.href = "profilo.html"; return; }
      else if (code.includes("activity_full")) msg = "posti finiti per questo evento.";
      else if (code.includes("age_not_allowed")) msg = "questo evento non è aperto alla tua età.";
      else if (code.includes("not_authenticated")) { logout(); return; }
    } catch (_) {}
    toast(msg);
  }

  if (logged) checkProfile();
  loadEvents().then(() => {
    if (!logged) return;
    // pallino sulla campanella: in silenzio se la rpc non c'è ancora
    rpc("unread_notifications", {}).then(async r => {
      if (!r || !r.ok) return;
      const n = await r.json().catch(() => 0);
      if (Number(n) > 0) document.getElementById("bell-dot").hidden = false;
    }).catch(() => {});
  });
  function toggleMap(){
    const show = document.body.classList.toggle("showmap");
    document.getElementById("maptoggle").innerHTML = show ? "☰ lista" : "🗺️ mappa";
    if (show) setTimeout(() => map.resize(), 60);
  }
</script>
</body>
</html>
