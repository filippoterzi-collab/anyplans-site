<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I miei eventi · anyplans</title>
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="robots" content="noindex">
<style>
  @font-face{
    font-family:"Bricolage Grotesque";
    src:url("/bricolage-grotesque-latin-800-normal.woff2") format("woff2");
    font-weight:800; font-style:normal; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  :root{
    --blue:#1B4FD8; --blue-lo:#1440AF; --tint:#E9EEFB;
    --ink:#191919; --grey:#6E6E73; --bg:#FBF9F5;
    --round: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Bricolage Grotesque", var(--round);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--round); color:var(--ink); background:var(--bg); line-height:1.5;
       -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  .display{font-family:var(--display); font-weight:800; letter-spacing:-.045em; line-height:1.05;}
  .q{font-size:.92em;}
  header{padding:0 24px;}
  .nav{display:flex; align-items:center; gap:24px; height:60px; max-width:760px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:800;
         font-size:20px; letter-spacing:-.045em; line-height:1;}
  .brand img{width:28px; height:28px;}
  .nav .lnk{font-weight:600; font-size:15px; color:var(--grey);}
  .nav .lnk.on{font-weight:700; color:var(--blue);}
  .nav .cta{margin-left:auto; background:var(--blue); color:#fff; font-weight:700; font-size:13.5px;
            padding:9px 16px; border-radius:999px; white-space:nowrap;}

  main{max-width:760px; margin:0 auto; padding:14px 24px 70px; display:flex; flex-direction:column; gap:14px;}
  h1{font-size:30px;}
  .day{display:flex; align-items:center; gap:8px; margin-top:6px;}
  .day .dot{width:8px; height:8px; border-radius:999px; background:rgba(25,25,25,.25);}
  .day.today .dot{background:var(--blue);}
  .day b{font-size:15px;}
  .day span{font-weight:600; font-size:13px; color:var(--grey);}
  .ev:active{transform:scale(.985); background:var(--tint);}
  .ev{display:flex; align-items:center; gap:14px; background:#fff;
      border:1.5px solid rgba(25,25,25,.10); border-radius:16px; padding:15px 16px;}
  .ev:hover{border-color:var(--blue);}
  .ev .tile{width:52px; height:52px; background:var(--tint); border-radius:13px; display:flex;
            align-items:center; justify-content:center; font-size:26px; flex-shrink:0;}
  .ev .time{font-size:12.5px; font-weight:700; color:var(--blue);}
  .ev .t{font-weight:700; font-size:15.5px;}
  .ev .m{font-size:12.5px; color:var(--grey);}
  .badge{margin-left:auto; background:var(--tint); color:var(--blue); font-weight:700; font-size:12px;
         padding:5px 11px; border-radius:999px; white-space:nowrap;}
  .empty{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding:50px 0;}
  .empty .btn{background:var(--blue); color:#fff; font-weight:700; padding:13px 26px;
              border-radius:999px; font-size:15.5px;}
  /* "Com'è andata a …?": invito a recensire gli eventi passati (design/sito-landing/spec-recensioni.md) */
  #review-prompts{display:flex; flex-direction:column; gap:10px;}
  #review-prompts:empty{display:none;}
  .rp{display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--tint); border-radius:16px; padding:14px 18px;}
  .rp .rp-txt{flex:1; min-width:180px; display:flex; flex-direction:column; gap:2px;}
  .rp .rp-txt b{font-size:15px;}
  .rp .rp-txt span{font-size:12.5px; color:var(--grey);}
  .rp .rp-stars{display:flex; gap:2px;}
  .rp .rp-stars a{width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:999px;}
  .rp .rp-stars svg{width:26px; height:26px; fill:#fff; stroke:var(--blue); stroke-width:1.6;}
  .rp .rp-stars a:hover svg, .rp .rp-stars a:focus-visible svg{fill:var(--blue);}
  .rp .rp-later{background:none; border:none; cursor:pointer; font:700 13px var(--round); color:var(--grey); padding:6px 0;}
  @media (max-width:700px){ .nav .lnk{display:none;} .rp{padding:12px 14px; gap:10px;} .rp .rp-later{margin-left:auto;} }

  /* ux: transizioni e feedback al tocco */
  .btn, .chip, .ev, .iconbtn, .card, .city, .qz-chip, .place-item, .toggle-row{
    transition: transform .12s ease, box-shadow .12s ease, background .15s ease,
                border-color .15s ease, color .15s ease;}
  .btn:active, .chip:active, .iconbtn:active, .qz-chip:active{transform:scale(.96);}
  .ev:hover{box-shadow:0 4px 16px rgba(25,25,25,.07); transform:translateY(-1px);}
  .card:hover, .city:hover{box-shadow:0 4px 14px rgba(25,25,25,.06);}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--blue); outline-offset:2px;}
</style>
</head>
<body>

<header></header>

<main>
  <h1 class="display">I miei eventi</h1>
  <div id="review-prompts"></div>
  <div id="list"><p style="color:var(--grey)">Carico…</p></div>
</main>

<script src="app.js?v=1788696862"></script>
<script>
  requireLogin();
  mountNav("i miei eventi", { col: 860 });
  mountTabbar("i miei eventi");

  async function load(){
    const r = await rpc("my_activities", {});
    const list = document.getElementById("list");
    if (!r || !r.ok) { list.innerHTML = '<p style="color:var(--grey)">Non riesco a caricare. Ricarica la pagina.</p>'; return; }
    const rows = (await r.json())
      .filter(x => isCurrent(x.start_at, x.end_at))
      .filter(x => x.my_status === "going" || x.my_status === "requested" || x.my_status === "waitlisted" || x.is_mine)
      .sort((a, b) => new Date(a.start_at) - new Date(b.start_at));

    if (!rows.length) {
      list.innerHTML = `<div class="empty" style="padding:34px 0 18px">
        <div style="font-size:48px">🫥</div>
        <p style="color:var(--grey); max-width:300px">Non sei ancora iscritto a nessun evento. Ecco i prossimi:</p>
      </div><div id="suggest" style="display:flex; flex-direction:column; gap:12px"></div>
      <div style="text-align:center; margin-top:18px"><a class="btn" style="display:inline-block" href="eventi.html">Vedi tutti gli eventi</a></div>`;
      suggest();
      return;
    }

    let html = "", lastDay = "";
    rows.forEach(x => {
      const when = new Date(x.start_at);
      if (dayKey(when) !== lastDay) {
        lastDay = dayKey(when);
        const isToday = dayKind(when) === "oggi";
        html += `<div class="day${isToday ? " today" : ""}"><span class="dot"></span><b>${dayLabel(when)}</b><span>${daySub(when)}</span></div>`;
      }
      const badge = x.is_mine ? "Lo organizzo io" : x.my_status === "requested" ? "Aspetto l'ok"
        : x.my_status === "waitlisted" ? "In lista d'attesa" + (x.my_waitlist_position ? " (" + ordinal(x.my_waitlist_position) + ")" : "") : "Ci vado ✓";
      const full = fullTxt(x.going_count, x.max_participants, x.waitlist_count);
      html += `<a class="ev" href="evento.html?id=${x.id}">
        <div class="tile"${x.photo_url ? ` style="background-image:url('${esc(x.photo_url)}'); background-size:cover; background-position:center"` : ""}>${x.photo_url ? "" : x.emoji || "📍"}</div>
        <div>
          <div class="time">${timeStr(when)} · ${relTime(when, x.end_at)}</div>
          <div class="t">${esc(x.title)}</div>
          <div class="m">${esc(x.meeting_point_text || "Zona indicativa")} · ${goingTxt(x.going_count)}${full ? ' · <b style="font-weight:600; color:var(--ink)">' + full + "</b>" : ""}</div>
        </div>
        <span class="badge">${badge}</span>
      </a>`;
    });
    list.innerHTML = html;
  }
  // eventi passati a cui sono stato e non ho ancora recensito: massimo 3 box, "Non adesso" li nasconde per la sessione
  const STAR_PATH = "M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z";
  const STAR_LABELS = ["da dimenticare", "così così", "bene", "molto bene", "fantastico"];
  const DISMISS_KEY = "anyplans_review_dismissed";
  function dismissedPrompts(){ try { return JSON.parse(sessionStorage.getItem(DISMISS_KEY)) || []; } catch (_) { return []; } }
  async function loadReviewPrompts(){
    const r = await rpc("my_reviewable_events", {});
    if (!r || !r.ok) return;
    const skip = new Set(dismissedPrompts());
    const rows = (await r.json().catch(() => []))
      .filter(x => !x.reviewed && !skip.has(x.activity_id))
      .sort((a, b) => new Date(b.start_at) - new Date(a.start_at)).slice(0, 3);
    document.getElementById("review-prompts").innerHTML = rows.map(x => {
      const href = "community.html?" + (x.community_slug ? "slug=" + encodeURIComponent(x.community_slug) : "id=" + encodeURIComponent(x.community_id || "")) +
        "&review=" + encodeURIComponent(x.activity_id);
      const stars = [1,2,3,4,5].map(n =>
        `<a href="${esc(href)}&stars=${n}" aria-label="${n} ${n === 1 ? "stella" : "stelle"}: ${STAR_LABELS[n - 1]}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_PATH}"/></svg></a>`).join("");
      return `<div class="rp" id="rp-${esc(x.activity_id)}">
        <div class="rp-txt"><b>Com'è andata a ${esc(x.activity_title)}?</b><span>${esc(x.community_name || "")} · ${esc(daySub(new Date(x.start_at)))}</span></div>
        <div class="rp-stars" role="group" aria-label="Quante stelle?">${stars}</div>
        <button type="button" class="rp-later" onclick="dismissPrompt('${esc(x.activity_id)}')">Non adesso</button>
      </div>`;
    }).join("");
  }
  function dismissPrompt(id){
    const d = dismissedPrompts(); d.push(id);
    try { sessionStorage.setItem(DISMISS_KEY, JSON.stringify(d)); } catch (_) {}
    const el = document.getElementById("rp-" + id); if (el) el.remove();
  }
  async function suggest(){
    const r = await rpc("feed_activities", { lat: 45.698, lng: 9.670, radius_m: 50000 });
    if (!r || !r.ok) return;
    const evs = (await r.json().catch(() => []))
      .filter(x => new Date(x.start_at) > new Date() && x.my_status !== "going")
      .sort((a, b) => new Date(a.start_at) - new Date(b.start_at)).slice(0, 3);
    document.getElementById("suggest").innerHTML = evs.map(x => {
      const when = new Date(x.start_at);
      return `<a class="ev" href="evento.html?id=${x.id}">
        <div class="tile"${x.photo_url ? ` style="background-image:url('${esc(x.photo_url)}'); background-size:cover; background-position:center"` : ""}>${x.photo_url ? "" : x.emoji || "📍"}</div>
        <div>
          <div class="time">${dayLabel(when)} ${timeStr(when)} · ${relTime(when, x.end_at)}</div>
          <div class="t">${esc(x.title)}</div>
          <div class="m">${esc(x.meeting_point_text || "Zona indicativa")} · ${goingTxt(x.going_count)}</div>
        </div>
        <span class="badge">Ci sono →</span>
      </a>`;
    }).join("");
  }
  load();
  loadReviewPrompts();
</script>
</body>
</html>
