<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventi a Bergamo · anyplans</title>
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
  @font-face{
    font-family:"Bricolage Grotesque";
    src:url("/bricolage-grotesque-latin-800-normal.woff2") format("woff2");
    font-weight:800; font-style:normal; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  :root{
    --blue:#1B4FD8; --blue-lo:#1440AF; --tint:#E9EEFB;
    --ink:#191919; --grey:#6E6E73; --bg:#FBF9F5;
    --round: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Bricolage Grotesque", var(--round);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--round); color:var(--ink); background:var(--bg); line-height:1.5;
       -webkit-font-smoothing:antialiased; height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  a{color:inherit; text-decoration:none;}
  [hidden]{display:none !important;}
  .display{font-family:var(--display); font-weight:800; letter-spacing:-.045em; line-height:1;}
  .q{font-size:.92em;}

  header{padding:0 24px; flex-shrink:0;}
  .nav{display:flex; align-items:center; gap:24px; height:60px;}
  .brand{display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:800;
         font-size:20px; letter-spacing:-.045em; line-height:1;}
  .brand img{width:28px; height:28px; display:block;}
  .nav .lnk{font-weight:600; font-size:15px; color:var(--grey);}
  .nav .lnk.on{font-weight:700; color:var(--blue);}
  .nav-right{margin-left:auto; display:flex; align-items:center; gap:12px;}
  .iconbtn{width:36px; height:36px; border-radius:999px; background:var(--tint); border:none;
           cursor:pointer; display:flex; align-items:center; justify-content:center;
           font-weight:800; font-size:14px; color:var(--blue); font-family:var(--round);}

  .topbar{padding:4px 24px 12px; display:flex; flex-direction:column; gap:12px; flex-shrink:0;}
  .titlerow{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .titlerow h1{font-size:30px;}
  .titlerow h1 span{color:var(--blue);}
  .count{font-weight:600; font-size:13.5px; color:var(--grey); margin-left:auto;}
  .chip{background:#fff; border:1.5px solid rgba(25,25,25,.14); color:var(--ink); font-weight:600;
        font-size:14px; height:40px; padding:0 15px; border-radius:999px; cursor:pointer;
        font-family:var(--round); flex-shrink:0; white-space:nowrap; display:inline-flex; align-items:center; gap:7px;}
  .chip:hover{border-color:var(--ink);}
  .chip.on{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700;}
  .chip.on:hover{border-color:var(--blue);}
  .chip svg{width:16px; height:16px; stroke:currentColor; flex-shrink:0;}
  .chip .x{font-weight:800; font-size:16px; margin-left:2px; line-height:1;}
  .day-chip{position:relative; cursor:pointer;}
  .day-chip input[type=date]{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;}
  /* ── blocco "cosa cerchi" (design/sito-landing/spec-cosa-cerchi.md) ── */
  .cc{background:#fff; border:1.5px solid rgba(25,25,25,.10); border-radius:20px; padding:24px 28px 22px;
      display:flex; flex-direction:column; gap:20px;}
  .cc-hi{font-size:28px;}
  .cc-q{display:grid; grid-template-columns:1fr 1fr 1.25fr; gap:32px;}
  .cc-q h2{font-size:16px; font-weight:800; margin-bottom:10px; font-family:var(--round); letter-spacing:0;}
  .cc-col{display:flex; flex-direction:column; gap:10px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .cc-field{display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid rgba(25,25,25,.16); border-radius:999px;}
  .cc-field input{border:none; outline:none; background:transparent; font:15px var(--round); color:var(--ink); flex:1; min-width:0; height:100%;}
  .cc-field input::placeholder{color:var(--grey);}
  .cc-field:focus-within, .cc-field.has{border-color:var(--blue);}
  .cc-place{position:relative;}
  .cc-place .cc-field{height:44px; padding:0 16px;}
  .cc-sugg{position:absolute; top:50px; left:0; right:0; z-index:30; background:#fff; border:1.5px solid rgba(25,25,25,.14);
           border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.10); overflow:hidden;}
  .cc-sugg [role=option]{height:44px; padding:0 14px; display:flex; align-items:center; gap:6px; font-size:14.5px; font-weight:600; cursor:pointer;}
  .cc-sugg [role=option] span{font-weight:600; color:var(--grey);}
  .cc-sugg [role=option]:hover, .cc-sugg [role=option].on{background:var(--tint);}
  .cc-sugg .none{padding:11px 14px; font-size:13.5px; color:var(--grey);}
  .cc-what{height:48px; padding:0 7px 0 16px;}
  .cc-what svg.lens{width:17px; height:17px; flex-shrink:0;}
  .cc-go{width:34px; height:34px; border-radius:999px; background:var(--blue); border:none; cursor:pointer; flex-shrink:0;
         display:flex; align-items:center; justify-content:center; transition:background .15s ease, transform .12s ease;}
  .cc-go:hover{background:var(--blue-lo);}
  .cc-go:active{transform:scale(.94);}
  .cc-ex{display:flex; flex-wrap:wrap; align-items:center; gap:8px; row-gap:10px;}
  .cc-ex .lbl{font-weight:600; font-size:13px; color:var(--grey);}
  .ex{display:inline-flex; align-items:center; gap:5px; height:34px; padding:0 13px; border-radius:999px; background:var(--tint); color:var(--blue);
      border:none; font:700 13.5px var(--round); cursor:pointer; white-space:nowrap; transition:background .15s ease, transform .12s ease;}
  .ex:hover{background:#DCE4F8;}
  .ex:active{transform:scale(.96);}
  .cc-foot{display:flex; justify-content:flex-end; margin-top:-6px;}
  .fl-clear{background:none; border:none; height:36px; padding:0 4px; color:var(--grey); font:600 14px var(--round);
            text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
  .fl-clear:hover{color:var(--ink);}
  /* riga compatta */
  .cc-compact{display:flex; align-items:center; width:100%; height:48px; padding:0 6px 0 18px; background:#fff; text-align:left;
              border:1.5px solid rgba(25,25,25,.14); border-radius:999px; cursor:pointer; font-family:var(--round);
              transition:border-color .15s ease;}
  .cc-compact:hover{border-color:var(--ink);}
  .cc-compact .txt{flex:1; min-width:0; font-weight:600; font-size:15px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cc-compact .chg{display:inline-flex; align-items:center; height:36px; padding:0 16px; border-radius:999px; background:var(--tint);
                   color:var(--blue); font-weight:700; font-size:14px; flex-shrink:0; margin-left:8px;}
  /* ── foglio dal basso su telefono (riuso della modale) ──────────── */
  .fl-overlay{position:fixed; inset:0; z-index:60; background:rgba(25,25,25,.45);
              display:flex; align-items:center; justify-content:center; padding:24px;
              opacity:0; visibility:hidden; transition:opacity .15s ease, visibility 0s linear .15s;}
  .fl-overlay.fl-open{opacity:1; visibility:visible; transition:opacity .15s ease;}
  .fl-modal{width:100%; max-width:480px; max-height:calc(100vh - 48px); background:#fff; border-radius:20px;
            display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.18);
            transform:scale(.98); transition:transform .15s ease;}
  .fl-open .fl-modal{transform:none;}
  .fl-handle{display:none;}
  .fl-head{display:flex; align-items:center; justify-content:space-between; padding:20px 24px 10px; flex-shrink:0;}
  .fl-head h2{font-size:24px;}
  .fl-x{width:44px; height:44px; margin:-8px -12px -8px 0; border:none; border-radius:999px; background:transparent;
        color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;
        transition:background .15s ease;}
  .fl-x:hover{background:var(--tint);}
  .fl-body{flex:1; min-height:0; overflow-y:auto; padding:6px 24px 10px; display:flex; flex-direction:column; gap:18px;}
  .fl-body .cc-q{display:flex; flex-direction:column; gap:18px;}
  .fl-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 24px;
           border-top:1px solid rgba(25,25,25,.10); background:#fff; flex-shrink:0;}
  .fl-reset{background:none; border:none; height:44px; padding:0 4px; color:var(--ink); font:700 14.5px var(--round);
            text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
  .fl-reset:disabled{color:var(--grey); text-decoration:none; cursor:default;}
  .fl-show{height:48px; min-width:170px; padding:0 22px; border-radius:999px; background:var(--blue); color:#fff;
           border:none; font:700 15px var(--round); cursor:pointer; transition:background .15s ease, transform .12s ease;}
  .fl-show:hover{background:var(--blue-lo);}
  .fl-show:active{transform:scale(.98);}
  .fl-show.zero{background:rgba(25,25,25,.08); color:var(--grey);}
  body.fl-lock{overflow:hidden;}
  @media (prefers-reduced-motion:reduce){ .fl-overlay, .fl-modal{transition:none;} }
  .ev .m .ha{display:inline-block; width:18px; height:18px; border-radius:999px; background:var(--blue);
             background-size:cover; background-position:center; vertical-align:-4px; margin-right:3px;}

  .split{flex:1; display:flex; min-height:0;}
  .list{width:46%; max-width:640px; overflow-y:auto; padding:6px 20px 40px 24px;
        display:flex; flex-direction:column; gap:14px;}
  .day{display:flex; align-items:center; gap:8px; margin-top:6px;}
  .day .dot{width:8px; height:8px; border-radius:999px; background:rgba(25,25,25,.25);}
  .day.today .dot{background:var(--blue);}
  .day b{font-size:15px;}
  .day span{font-weight:600; font-size:13px; color:var(--grey);}
  .ev{display:flex; align-items:center; gap:14px; background:#fff;
      border:1.5px solid rgba(25,25,25,.10); border-radius:16px; padding:14px 16px; cursor:pointer;}
  .ev:hover, .ev.on{border-color:var(--blue);}
  .ev .tile{width:52px; height:52px; background:var(--tint); border-radius:13px; display:flex;
            align-items:center; justify-content:center; font-size:26px; flex-shrink:0;}
  .ev .time{font-size:12.5px; font-weight:700; color:var(--blue);}
  .ev .time .soon, .pop .soon{color:#B4530A;}
  /* in evidenza (deciso 06/09/2026): i piani che si fanno già, 2+ persone */
  .ev.hot{border-color:var(--blue); box-shadow:0 6px 18px rgba(27,79,216,.12);}
  .ev .fa{display:inline-flex; align-items:center; gap:4px; background:var(--tint); color:var(--blue); font-weight:800; font-size:12px; padding:3px 9px; border-radius:999px; margin-top:6px;}
  .day.hot .dot{background:none; width:auto; height:auto;}
  .pin.hot{width:50px; height:50px; font-size:24px; box-shadow:0 0 0 3px var(--blue), 0 4px 14px rgba(27,79,216,.35);}
  .pin.hot::after{content:attr(data-n); position:absolute; right:-6px; top:-6px; min-width:20px; height:20px; padding:0 5px; border-radius:999px; background:var(--blue); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; font-family:var(--round);}
  /* orario sopra ogni pin, sempre (deciso 06/09/2026: "così uno sulla mappa vede quanto manca") */
  .pin .tm{position:absolute; top:-26px; left:50%; transform:translateX(-50%); white-space:nowrap; background:#E8F5EC; color:#1E8E3E; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; pointer-events:none;}
  .pin .tm.soon{background:#FDEEDC; color:#B4530A;}
  /* un evento già cominciato resta in lista finché non finisce: si vede a colpo d'occhio */
  .ev .time .live, .pop .live{color:#0E8A4A;}
  .ev .t{font-weight:700; font-size:15px;} .ev a.t:hover{color:var(--blue);}
  .ev .m{font-size:12.5px; color:var(--grey);}
  .ev .tile{position:relative;}
  .ev.lock .tile{background:#fff; border:1.5px dashed rgba(25,25,25,.4); background-image:none !important;}
  .ev.waiting .tile{background:var(--tint); border:none;}
  .ev.lock .tile::after, .ev.waiting .tile::after{content:"🔒"; position:absolute; right:-6px; bottom:-6px; width:20px; height:20px; border-radius:999px; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1; background:#fff; border:1.5px solid rgba(25,25,25,.4); pointer-events:none;}
  .ev.waiting .tile::after{background:var(--blue); border-color:#fff;}
  /* chiuso (nessuno): nome e indirizzo non si leggono; restano emoji, categoria, città e ora */
  .ev.closed .t{filter:blur(6px); user-select:none;}
  .pop.closed .t{filter:blur(5px); user-select:none;}
  .ev .go{margin-left:auto; font-weight:700; font-size:13.5px; color:var(--blue);
          white-space:nowrap; background:none; border:none; cursor:pointer; font-family:var(--round);}
  .ev .go.ok{color:var(--ink);}
  .ev .go.wait{color:var(--grey);}
  .empty{color:var(--grey); font-size:14.5px; padding:24px 4px;}
  .empty a{color:var(--blue); font-weight:700;}
  /* nessun risultato (spec §5) */
  .nores{background:#fff; border:1.5px solid rgba(25,25,25,.10); border-radius:16px; padding:22px 24px; display:flex; flex-direction:column; gap:14px;}
  .nores .head{display:flex; gap:16px; align-items:flex-start;}
  .nores .tile{width:56px; height:56px; background:var(--tint); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0;}
  .nores h3{font-weight:800; font-size:18px; line-height:1.25;}
  .nores h3 span{font-weight:600; color:var(--grey);}
  .nores p{font-size:15px; color:var(--grey);}
  .nores .btns{display:flex; gap:10px; flex-wrap:wrap;}
  .nores .note{font-size:13px; color:var(--grey);}
  .nores .ev{padding:12px 14px;}
  .nores .ev .tile{width:48px; height:48px; font-size:24px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; height:48px; padding:0 22px; border-radius:999px;
       font:700 15px var(--round); cursor:pointer; white-space:nowrap; border:none; transition:background .15s ease, transform .12s ease;}
  .btn:active{transform:scale(.98);}
  .btn.blue{background:var(--blue); color:#fff;} .btn.blue:hover{background:var(--blue-lo);}
  .btn.ghost{background:#fff; color:var(--blue); box-shadow:inset 0 0 0 2px var(--blue);} .btn.ghost:hover{background:var(--tint);}
  .btn:disabled{opacity:.6; cursor:default;}
  .saved{background:var(--tint); border-radius:16px; padding:20px 24px; display:flex; gap:14px; align-items:flex-start;}
  .saved .bell{width:40px; height:40px; border-radius:999px; background:var(--blue); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .saved h3{font-weight:800; font-size:17px; line-height:1.25;}
  .saved p{font-size:14px; color:var(--grey); margin-top:4px;}
  .saved a, .saved button{color:var(--blue); font-weight:700; background:none; border:none; font-family:var(--round); font-size:inherit; cursor:pointer; padding:0;}
  .meanwhile{font-weight:700; font-size:15px; margin-top:6px;}
  .sk{height:84px; border-radius:16px; background:linear-gradient(90deg,#F1EFE9 25%,#E9E6DE 50%,#F1EFE9 75%);
      background-size:200% 100%; animation:sk 1.2s ease-in-out infinite;}
  @keyframes sk{from{background-position:200% 0} to{background-position:-200% 0}}

  #map{flex:1; border-radius:22px 0 0 0; min-height:0;}
  .pin{width:38px; height:38px; background:#fff; border:1.5px solid rgba(25,25,25,.2);
       border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:17px;
       box-shadow:0 1px 4px rgba(0,0,0,.12); cursor:pointer;}
  .pin.on{background:var(--blue); border-color:var(--blue);}
  .pin.today{box-shadow:0 0 0 2.5px var(--blue), 0 1px 4px rgba(0,0,0,.12);}
  /* lucchetto sociale (UI.md §3.9, spec design/sito-landing/spec-pin-lucchetto.md): emoji sempre visibile, stato nel pallino in basso a destra.
     Niente position:relative sui marker: MapLibre li mette già absolute, e il ::after si aggancia a quello. */
  .pin.lock{border-style:dashed; border-color:rgba(25,25,25,.4);}
  .pin.waiting{border-style:solid; border-color:rgba(25,25,25,.2);}
  .pin.lock::after, .pin.waiting::after{content:"🔒"; position:absolute; right:-4px; bottom:-4px; width:16px; height:16px; border-radius:999px; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center; font-size:10px; line-height:1; background:#fff; border:1.5px solid rgba(25,25,25,.4); pointer-events:none;}
  .pin.waiting::after{background:var(--blue); border-color:#fff;}
  .map-pill{position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:5; height:38px; padding:0 16px;
            background:#fff; border:1.5px solid rgba(25,25,25,.14); border-radius:999px; font-weight:700; font-size:13.5px;
            display:flex; align-items:center; white-space:nowrap; pointer-events:none;}
  .maplibregl-popup-content{border-radius:14px; font-family:var(--round); padding:12px 14px;
       box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .pop .t{font-weight:700; font-size:14px; color:var(--ink);}
  a.pop, a.pop:focus{outline:none; -webkit-tap-highlight-color:transparent;}
  .maplibregl-popup-content{border-radius:16px; padding:14px 16px; box-shadow:0 8px 24px rgba(0,0,0,.14);}
  .maplibregl-popup-close-button{display:none;}
  .pop .open{display:inline-flex; align-items:center; height:34px; padding:0 14px; margin-top:8px; border-radius:999px; background:var(--blue); color:#fff; font-weight:800; font-size:13px;}
  .pop .m{font-size:12px; color:var(--grey); margin-top:2px;}

  #maptoggle, #map-me{display:none;}
  @media (max-width:700px){
    /* telefono: mappa a tutto schermo, lista come foglio che sale (docs/UI.md §3.1, deciso 06/09/2026) */
    body{height:100dvh; box-sizing:border-box;}
    .titlerow{display:none;}   /* il numero degli eventi sta nella pill */
    .nav .lnk{display:none;}
    .nav-right a, .nav-right .iconbtn[title]{display:none;}
    .nav-right #avatar, .nav-right #bell{display:flex;}
    .nav-right #nav-reg{display:inline-block;}
    .topbar{padding:4px 18px 10px;}
    .titlerow h1{font-size:24px;}
    .cc{padding:18px; gap:18px;}
    .cc-hi{font-size:24px;}
    .cc-q{display:flex; flex-direction:column; gap:18px;}
    .cc-field input{font-size:16px;}
    .cc-compact .txt{font-size:14.5px;}
    .nores{padding:18px;}
    .nores .btns{flex-direction:column;}
    .nores .btns .btn{width:100%;}
    .saved{padding:16px 18px;}
    .fl-overlay{align-items:flex-end; padding:0;}
    .fl-modal{max-width:none; max-height:calc(100dvh - 24px); border-radius:22px 22px 0 0;
              box-shadow:none; transform:translateY(100%);}
    .fl-open .fl-modal{transform:none;}
    .fl-handle{display:block; width:36px; height:4px; border-radius:999px; background:rgba(25,25,25,.18); margin:10px auto 0;}
    .fl-head{padding:8px 18px 8px;}
    .fl-body{padding:4px 18px 16px;}
    .fl-foot{position:sticky; bottom:0; padding:12px 18px calc(12px + env(safe-area-inset-bottom));}
    .fl-show{flex:1; min-width:0;}
    /* overflow:hidden: il foglio della lista, spostato sotto, non deve allungare la pagina (su iPhone Safari
       altrimenti la pagina scorre e la lista spunta a metà sotto la mappa) */
    .split{position:relative; overflow:hidden;}
    html, body{overscroll-behavior:none; position:fixed; inset:0; width:100%;}
    #map{position:absolute; inset:0; border-radius:0; margin:0;}
    #map .maplibregl-ctrl-top-right{display:none;}   /* +/- non servono col pizzico */
    .list{position:absolute; inset:0; z-index:6; width:100%; max-width:none; padding:12px 18px 100px; background:var(--bg);
          transform:translateY(100%); transition:transform .22s ease-out;}
    body.showlist .list{transform:none;}
    @media (prefers-reduced-motion: reduce){ .list{transition:none;} }
    #maptoggle{display:flex; align-items:center; gap:7px; position:fixed; left:50%;
      transform:translateX(-50%); bottom:84px; z-index:40; background:#fff; color:var(--ink); border:1.5px solid rgba(25,25,25,.12);
      font-weight:700; font-size:14px; height:48px; padding:0 22px; border-radius:999px;
      cursor:pointer; font-family:var(--round); box-shadow:0 4px 16px rgba(0,0,0,.16);}
    #map-me{display:flex; position:fixed; right:16px; bottom:84px; z-index:40; width:44px; height:44px; border-radius:999px;
      background:#fff; border:1.5px solid rgba(25,25,25,.12); box-shadow:0 4px 16px rgba(0,0,0,.16); align-items:center; justify-content:center; cursor:pointer;}
    body.showlist #map-me{display:none;}
  }

  /* ux: transizioni e feedback al tocco */
  .btn, .chip, .ev, .iconbtn, .card, .city, .qz-chip, .place-item, .toggle-row{
    transition: transform .12s ease, box-shadow .12s ease, background .15s ease,
                border-color .15s ease, color .15s ease;}
  .btn:active, .chip:active, .iconbtn:active, .qz-chip:active{transform:scale(.96);}
  .ev:hover{box-shadow:0 4px 16px rgba(25,25,25,.07); transform:translateY(-1px);}
  .card:hover, .city:hover{box-shadow:0 4px 14px rgba(25,25,25,.06);}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--blue); outline-offset:2px;}
</style>
</head>
<body>

<header></header>

<div class="topbar">
  <div class="titlerow">
    <h1 class="display">Eventi a <span>Bergamo</span></h1>
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <section class="cc" id="cc" aria-label="Cosa cerchi">
    <p class="display cc-hi" id="cc-hi">Ciao!</p>
    <div class="cc-q" id="cc-q">
      <div>
        <h2 id="cc-h-when">Quando vuoi uscire?</h2>
        <div class="chips" role="group" aria-labelledby="cc-h-when">
          <button class="chip day-chip" data-day="oggi" aria-pressed="false" onclick="setDay(this)">Oggi</button>
          <button class="chip day-chip" data-day="domani" aria-pressed="false" onclick="setDay(this)">Domani</button>
          <button class="chip day-chip" data-day="weekend" aria-pressed="false" onclick="setDay(this)">Nel fine settimana</button>
          <label class="chip day-chip" data-day="data" id="chip-date" aria-pressed="false" onclick="openDate(event)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10 L20.5 10"/><path d="M8 3 L8 7"/><path d="M16 3 L16 7"/></svg><span id="date-txt">Scegli un giorno</span><b class="x" id="date-x" hidden onclick="clearDate(event)">×</b><input type="date" id="fl-date" aria-label="Scegli un giorno" onchange="setDate(this.value)"></label>
        </div>
      </div>
      <div>
        <h2 id="cc-h-cat">Cosa?</h2>
        <div class="chips" role="group" aria-labelledby="cc-h-cat">
          <button class="chip cat-chip on" data-cat="" aria-pressed="true" onclick="setCat(this)">Tutto</button>
          <button class="chip cat-chip" data-cat="festival" aria-pressed="false" onclick="setCat(this)">🎪 Sagre</button>
          <button class="chip cat-chip" data-cat="sport" aria-pressed="false" onclick="setCat(this)">🏃 Sport</button>
          <button class="chip cat-chip" data-cat="cucina" aria-pressed="false" onclick="setCat(this)">🍳 Cucina</button>
          <button class="chip cat-chip" data-cat="creatività" aria-pressed="false" onclick="setCat(this)">🏺 Creatività</button>
          <button class="chip cat-chip" data-cat="giardinaggio" aria-pressed="false" onclick="setCat(this)">🌱 Volontariato</button>
          <button class="chip cat-chip" data-cat="benessere" aria-pressed="false" onclick="setCat(this)">🧘 Benessere</button>
        </div>
      </div>
      <div>
        <h2 id="cc-h-where">Dove?</h2>
        <div class="cc-col">
          <div class="chips" role="group" aria-labelledby="cc-h-where">
            <button class="chip" id="chip-me" aria-pressed="false" onclick="useMyLocation()">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 L10 13"/><path d="M21 3 L14.5 21 L10 13 L3 9.5 Z"/></svg><span id="chip-me-txt">Vicino a me</span>
            </button>
            <button class="chip" id="chip-bg" aria-pressed="false" onclick="setWhere(whereIs('bg') ? null : BG_CITY)">Bergamo città</button>
            <button class="chip on" id="chip-place" aria-pressed="true" onclick="setWhere(null)" hidden><span id="chip-place-txt"></span><b class="x">×</b></button>
          </div>
          <div class="cc-place" id="cc-place">
            <div class="cc-field">
              <input id="place" placeholder="Scrivi un paese, per esempio Stezzano" aria-label="Scrivi un paese" autocomplete="off"
                     role="combobox" aria-expanded="false" aria-controls="cc-sugg" aria-autocomplete="list"
                     oninput="onPlaceInput()" onkeydown="onPlaceKey(event)">
            </div>
            <div class="cc-sugg" id="cc-sugg" role="listbox" aria-label="Paesi trovati" hidden></div>
          </div>
        </div>
      </div>
      <div>
        <h2 id="cc-h-what">Oppure scrivi cosa cerchi</h2>
        <div class="cc-col">
          <form class="cc-field cc-what" id="cc-what" onsubmit="event.preventDefault(); search()">
            <svg class="lens" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg>
            <input id="q" placeholder="Per esempio: c'è qualcuno che fa ceramica?" aria-labelledby="cc-h-what" autocomplete="off"
                   enterkeyhint="search" oninput="document.getElementById('cc-what').classList.toggle('has', !!this.value.trim())">
            <button type="submit" class="cc-go" aria-label="Cerca">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12 L19 12"/><path d="M13 6 L19 12 L13 18"/></svg>
            </button>
          </form>
          <div class="cc-ex" id="cc-ex"></div>
        </div>
      </div>
    </div>
    <div class="cc-foot" id="cc-foot" hidden><button class="fl-clear" onclick="clearAll()">Cancella tutto</button></div>
  </section>
  <button class="cc-compact" id="cc-compact" onclick="openCard()" hidden><span class="txt" id="cc-compact-txt"></span><span class="chg">Cambia</span></button>
</div>

<div class="fl-overlay" id="fl" role="dialog" aria-modal="true" aria-labelledby="fl-title" onclick="if(event.target===this) closeSheet()">
  <div class="fl-modal">
    <div class="fl-handle" aria-hidden="true"></div>
    <div class="fl-head">
      <h2 class="display" id="fl-title">Ciao!</h2>
      <button class="fl-x" onclick="closeSheet()" aria-label="Chiudi">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="fl-body" id="fl-body"></div>
    <div class="fl-foot">
      <button class="fl-reset" id="fl-reset" onclick="clearAll()" disabled>Cancella tutto</button>
      <button class="fl-show" id="fl-show" onclick="closeSheet()">Mostra <span id="fl-count">…</span></button>
    </div>
  </div>
</div>

<button id="maptoggle" onclick="toggleMap()" aria-label="Apri la lista">☰ Lista</button>
<button id="map-me" onclick="useMyLocation()" aria-label="Vai dove sono"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B4FD8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 L10 13"/><path d="M21 3 L14.5 21 L10 13 L3 9.5 Z"/></svg></button>

<div class="split">
  <div class="list" id="list"></div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="app.js?v=1788726235"></script>
<script>
  // sessione passata via #s= quando il browser blocca lo storage (safari su file://)
  if (!session && location.hash.startsWith("#s=")) {
    try { saveSession(JSON.parse(decodeURIComponent(location.hash.slice(3)))); history.replaceState(null, "", location.pathname); } catch (_) {}
  }
  // deciso 04/09: prima ci si registra (basta l'email), poi si vede la mappa
  requireLogin();
  mountNav("eventi");
  const logged = !!(session && session.access_token);
  if (!logged) {
    document.getElementById("avatar").parentElement.hidden = true;
    const bell = document.getElementById("bell"); if (bell) bell.style.display = "none";
    const reg = document.createElement("a"); reg.href = "login.html"; reg.id = "nav-reg";
    reg.style.cssText = "background:var(--blue); color:#fff; font-weight:700; font-size:13.5px; padding:9px 16px; border-radius:999px; white-space:nowrap";
    reg.textContent = "Registrati"; reg.onclick = () => { try { sessionStorage.setItem("anyplans_next", "eventi.html"); } catch (_) {} };
    document.querySelector(".nav-right").prepend(reg);
  }
  if (logged) {
    document.getElementById("avatar").textContent = (session.email || "?")[0].toUpperCase();
    document.getElementById("menu-email").textContent = session.email || "";
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#menu") && e.target.id !== "avatar") document.getElementById("menu").hidden = true;
    });
  }
  mountTabbar(new URLSearchParams(location.search).get("chiedi") === "1" ? "chiedi" : "eventi");
  if (!logged) document.querySelectorAll("#tabbar a").forEach(a => { if (!a.getAttribute("href").includes("eventi.html")) a.onclick = () => { try { sessionStorage.setItem("anyplans_next", a.getAttribute("href")); } catch (_) {} }; });

  let EVENTS = [];
  const BG = { lat: 45.698, lng: 9.670 };                                        // centro del feed (50 km)
  const BG_CITY = { kind: "bg", name: "Bergamo città", lat: 45.6983, lng: 9.6773, km: 6 };
  let feedCenter = BG;

  async function checkProfile(){
    const r = await rpc("my_profile");
    if (!r || !r.ok) return; // il feed funziona comunque
    const rows = await r.json().catch(() => []);
    if (!rows.length || !rows[0].display_name) location.replace("profilo.html");
    else {
      document.getElementById("menu-name").textContent = rows[0].display_name;
      const first = rows[0].display_name.trim().split(/\s+/)[0];
      document.getElementById("cc-hi").textContent = "Ciao " + first + "!";
      document.getElementById("fl-title").textContent = "Ciao " + first + "!";
    }
  }

  async function loadEvents(center){
    center = center || BG;
    const list = document.getElementById("list");
    list.innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    const r = await rpc("feed_activities", { lat: center.lat, lng: center.lng, radius_m: 50000 });
    if (!r || !r.ok) { list.innerHTML = '<div class="empty">Non riesco a caricare gli eventi. Ricarica la pagina.</div>'; return; }
    const rows = await r.json();
    // su telefono, all'apertura, niente inquadratura a 50 km (i pin si sovrapponevano): resta lo zoom città
    refit = center !== BG || !mobileFilters.matches;
    feedCenter = center;
    EVENTS = rows.map(x => ({
      id: x.id,
      emoji: x.emoji || "📍",
      cat: CAT_BY_SLUG[x.sport] || "sport",
      slug: x.sport,
      title: x.title,
      host: x.community_name || x.host_name || x.club_name || null,   // evento di un gruppo: il gruppo, non chi lo ha creato
      hostAvatar: x.host_avatar || null,
      place: x.meeting_point_text || "Zona indicativa",
      when: new Date(x.start_at),
      end: x.end_at ? new Date(x.end_at) : null,
      going: Number(x.going_count) || 0,
      cap: x.max_participants || null,
      wl: Number(x.waitlist_count) || 0,
      my: x.my_status,
      mine: x.is_mine,
      request: x.visibility === "request",
      price: x.price_cents ?? null,
      photo: x.photo_url || null,
      community: x.community_id || null,
      claimed: x.claimed_by || null,
      gender: x.gender_allowed || null,
      lat: x.lat, lng: x.lng
    })).sort((a, b) => a.when - b.when);
    buildMarkers();
    render();
    requestAnimationFrame(() => map.resize());
  }

  // mappa: stesso stile open source dell'app android (maplibre + openfreemap "liberty")
  const map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: [9.665, 45.7031],
    zoom: 12.3
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
  // pill "Nessun evento con questa ricerca" e cerchio del raggio (solo quando la ricerca è vuota)
  const mapPill = document.createElement("div"); mapPill.className = "map-pill"; mapPill.textContent = "Nessun evento con questa ricerca"; mapPill.hidden = true;
  map.getContainer().appendChild(mapPill);
  let mapReady = false;
  map.on("load", () => {
    map.addSource("radius", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({ id: "radius-fill", type: "fill", source: "radius", paint: { "fill-color": "#1B4FD8", "fill-opacity": .08 } });
    map.addLayer({ id: "radius-line", type: "line", source: "radius", paint: { "line-color": "#1B4FD8", "line-width": 1.5, "line-dasharray": [2, 2] } });
    mapReady = true; syncRadius();
    // su telefono il contenitore prende l'altezza vera solo dopo il primo layout: il canvas va rimisurato
    map.resize(); requestAnimationFrame(() => map.resize());
  });
  function circleGeo(c){
    const pts = [], n = 64;
    for (let i = 0; i <= n; i++) {
      const a = i / n * 2 * Math.PI;
      const dLat = c.km / 111.32 * Math.cos(a), dLng = c.km / (111.32 * Math.cos(c.lat * Math.PI / 180)) * Math.sin(a);
      pts.push([c.lng + dLng, c.lat + dLat]);
    }
    return { type: "FeatureCollection", features: [{ type: "Feature", geometry: { type: "Polygon", coordinates: [pts] } }] };
  }
  let showRadius = false;
  function syncRadius(){
    if (!mapReady) return;
    map.getSource("radius").setData(showRadius && where ? circleGeo(where) : { type: "FeatureCollection", features: [] });
  }

  let markers = {};
  function buildMarkers(){
    Object.values(markers).forEach(m => m.remove());
    markers = {};
    EVENTS.forEach(ev => {
      const el = document.createElement("div");
      const lk = lockOf(ev), open = lk === "open";
      el.className = "pin" + (dayKind(ev.when) === "oggi" ? " today" : "") + (open ? "" : " lock") + (lk === "waiting" ? " waiting" : ""); el.id = "pin-" + ev.id;
      paintPin(el, ev);
      const popup = new maplibregl.Popup({ offset: 22, closeButton: false })
        .setHTML(`<a class="pop${lk === "closed" ? " closed" : ""}" href="evento.html?id=${ev.id}" style="display:block; color:inherit; text-decoration:none"><div class="t">${esc(ev.title)}</div><div class="m">${dayLabel(ev.when)} · ${timeStr(ev.when)} · ${relHtmlOf(ev)} · ${esc(lk === "closed" ? (cityOf(ev.place) || ev.place) : ev.place)}${ev.price > 0 ? " · " + esc(fmtPrice(ev.price)) : ""}${fullHtml(ev)}${open ? "" : " · " + esc(lockTxtOf(ev))}</div><span class="open">Apri l'evento →</span></a>`);
      const mk = new maplibregl.Marker({ element: el }).setLngLat([ev.lng, ev.lat]).setPopup(popup).addTo(map);
      // tocco sul pin: fumetto con nome, ora, città e "Apri l'evento →" (anche su telefono, deciso 06/09/2026)
      el.addEventListener("click", () => highlight(ev.id, false));
      markers[ev.id] = mk;
    });
  }

  // ── stato della ricerca ──────────────────────────────────────────
  // day: "" | "oggi" | "domani" | "weekend" | "data" (+ dateSel); where: null | {kind:"me"|"bg"|"place", name, lat, lng, km}
  // qText: quello che ha scritto; parsed: expandQuery(qText) o null; cardOpen: card riaperta da "Cambia"
  // si parte da "Oggi" (deciso 06/09/2026): la domanda del marchio è "c'è qualcosa oggi?", non "nei prossimi mesi"
  let day = "oggi", dateSel = null, where = null, qText = "", parsed = null, cardOpen = false, locating = false;
  let refit = false, lastVisible = [], savedSearches = [], lastEmptyKey = "";
  const isoLocal = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const mobileFilters = window.matchMedia("(max-width:700px)");
  const fl = document.getElementById("fl");
  const isSheetOpen = () => fl.classList.contains("fl-open");
  const inMapView = () => mobileFilters.matches && !document.body.classList.contains("showlist");
  // filtro "Cosa?" (deciso 06/09/2026): "" = tutto, "festival" = solo sagre (slug), altrimenti una categoria
  let catSel = "";
  const CAT_CHIP = { festival:"Sagre", sport:"Sport", cucina:"Cucina", "creatività":"Creatività", giardinaggio:"Volontariato", benessere:"Benessere" };
  const catCompact = () => CAT_CHIP[catSel] || "";
  const inCat = e => !catSel || (catSel === "festival" ? e.slug === "festival" : e.cat === catSel);
  function setCat(btn){ catSel = catSel === btn.dataset.cat ? "" : btn.dataset.cat; refit = true; choose(); }
  function syncCat(){ document.querySelectorAll(".cat-chip").forEach(c => { const on = c.dataset.cat === catSel; c.classList.toggle("on", on); c.setAttribute("aria-pressed", String(on)); }); }
  const hasChoice = () => !!(day || where || qText || catSel);
  const whereIs = k => !!(where && where.kind === k);
  const shortLabel = slug => ((CATALOG[slug] || {}).l || slug).split(/[,/]/)[0].trim();
  const CAT_EMOJI = { sport:"🏃", cucina:"🍳", "creatività":"🏺", giardinaggio:"🌱", cultura:"🎪", benessere:"🧘" };
  const EXAMPLES = ["Sport", "Cucina", "Ceramica", "Feste di paese", "Volontariato", "Gratis"];
  const qInput = document.getElementById("q");

  // ── card aperta / riga compatta / foglio su telefono ─────────────
  function openCard(){
    if (inMapView()) { openSheet(); return; }
    cardOpen = true; syncCard();
    if (qText) qInput.focus({ preventScroll: true });
  }
  function compact(){ cardOpen = false; syncCard(); }
  function openSheet(){
    document.getElementById("fl-body").appendChild(document.getElementById("cc-q"));
    fl.classList.add("fl-open"); document.body.classList.add("fl-lock");
    fl.querySelector(".fl-x").focus();
  }
  function closeSheet(){
    if (!isSheetOpen()) return;
    fl.classList.remove("fl-open"); document.body.classList.remove("fl-lock");
    document.getElementById("cc").insertBefore(document.getElementById("cc-q"), document.getElementById("cc-foot"));
    cardOpen = false; syncCard();
    document.getElementById("cc-compact").focus();
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); hideSugg(); } });
  // tocco fuori dalla card riaperta: si richiude
  document.addEventListener("click", e => {
    if (!cardOpen || !hasChoice() || isSheetOpen()) return;
    if (e.target.closest("#cc") || e.target.closest("#cc-compact") || !document.body.contains(e.target)) return;
    compact();
  });
  mobileFilters.addEventListener("change", () => { if (!mobileFilters.matches) closeSheet(); syncCard(); });

  function dayText(){
    if (day === "oggi") return "oggi";
    if (day === "domani") return "domani";
    if (day === "weekend") return "nel fine settimana";
    if (day === "data" && dateSel) return "il " + dateSel.getDate() + " " + MONTHS[dateSel.getMonth()];
    return "";
  }
  function dayCompact(){
    if (day === "oggi") return "Oggi";
    if (day === "domani") return "Domani";
    if (day === "weekend") return "Nel fine settimana";
    if (day === "data" && dateSel) return dateSel.getDate() + " " + MONTHS[dateSel.getMonth()].slice(0, 3);
    return "";
  }
  // "vicino a te" / "a Bergamo" / "vicino a Stezzano" (nelle frasi); per la riga compatta il nome del chip
  function whereText(){
    if (!where) return "";
    if (where.kind === "me") return "vicino a te";
    if (where.kind === "bg") return "a Bergamo";
    return (/^[aeiou]/i.test(where.name) ? "vicino ad " : "vicino a ") + where.name;
  }
  const whereCompact = () => !where ? "" : where.kind === "me" ? "Vicino a me" : where.name;
  // il tipo capito ("ceramica", "sport", "gratis") oppure il testo tra virgolette
  function understood(){ return !!(parsed && (parsed.slugs.length || parsed.category || parsed.free)); }
  function whatText(){
    if (!parsed) return "";
    if (parsed.slugs.length) return parsed.slugs.map(s => shortLabel(s).toLowerCase()).slice(0, 2).join(" o ") + (parsed.free ? " gratis" : "");
    if (parsed.category) return parsed.category + (parsed.free ? " gratis" : "");
    if (parsed.free && !parsed.rest.length) return "gratis";
    return "'" + (qText.length > 32 ? qText.slice(0, 32) + "…" : qText) + "'";
  }
  // per il contatore: "di ceramica" / "gratis" / "per 'ballo'"
  function whatPhrase(){
    const w = whatText(); if (!w) return "";
    if (w === "gratis") return "gratis";
    return (understood() ? "di " : "per ") + w;
  }
  function compactText(){
    const parts = [dayCompact(), whereCompact(), catCompact(), whatText()].filter(Boolean);
    return parts.length ? parts.join(" · ") : "Tutti i prossimi giorni · Bergamo e dintorni";
  }
  function syncCard(){
    const chosen = hasChoice();
    // su telefono la scheda parte chiusa anche senza scelte: prima gli eventi, la ricerca è una riga che apre il foglio
    const open = !inMapView() && (cardOpen || (!chosen && !mobileFilters.matches));
    document.getElementById("cc").hidden = !open;
    const cp = document.getElementById("cc-compact");
    cp.hidden = open;
    document.getElementById("cc-compact-txt").textContent = compactText();
    cp.querySelector(".chg").textContent = chosen ? "Cambia" : "Cerca";
    const parts = [dayText(), whereText(), catCompact().toLowerCase(), whatText()].filter(Boolean);
    cp.setAttribute("aria-label", "Cambia cosa cerchi" + (parts.length ? ": " + parts.join(", ") : ""));
    document.getElementById("cc-foot").hidden = !chosen;
    document.getElementById("fl-reset").disabled = !chosen;
    syncChips(); syncWhere(); syncCat(); syncExamples();
  }
  function syncChips(){
    document.querySelectorAll(".day-chip").forEach(c => { const on = c.dataset.day === day; c.classList.toggle("on", on); c.setAttribute("aria-pressed", String(on)); });
    if (day !== "data") {
      dateSel = null; document.getElementById("fl-date").value = "";
      document.getElementById("date-txt").textContent = "Scegli un giorno"; document.getElementById("date-x").hidden = true;
    }
  }
  function syncWhere(){
    const me = document.getElementById("chip-me"), bg = document.getElementById("chip-bg"), pl = document.getElementById("chip-place");
    me.classList.toggle("on", whereIs("me")); me.setAttribute("aria-pressed", String(whereIs("me")));
    document.getElementById("chip-me-txt").textContent = locating ? "Vicino a me…" : "Vicino a me";
    me.disabled = locating;
    bg.classList.toggle("on", whereIs("bg")); bg.setAttribute("aria-pressed", String(whereIs("bg")));
    pl.hidden = !whereIs("place");
    if (whereIs("place")) document.getElementById("chip-place-txt").textContent = where.name;
    document.getElementById("cc-place").hidden = whereIs("place");
  }
  // sotto la casella: gli esempi, oppure "Ho capito: 🏺 Ceramica"
  function syncExamples(){
    const ex = document.getElementById("cc-ex");
    if (understood()) {
      const chips = [];
      if (parsed.slugs.length) parsed.slugs.forEach(s => chips.push(((CATALOG[s] || {}).e || "📍") + " " + shortLabel(s)));
      else if (parsed.category) chips.push(CAT_EMOJI[parsed.category] + " " + parsed.category[0].toUpperCase() + parsed.category.slice(1));
      if (parsed.free) chips.push("Gratis");
      ex.innerHTML = '<span class="lbl">Ho capito:</span>' + chips.map(c => `<span class="ex">${esc(c)}</span>`).join("");
    } else {
      ex.innerHTML = '<span class="lbl">Per esempio:</span>' + EXAMPLES.map(c => `<button class="ex" onclick="example(this.textContent)">${c}</button>`).join("");
    }
  }
  function example(t){ qInput.value = t; document.getElementById("cc-what").classList.add("has"); search(); }

  // ── quando ───────────────────────────────────────────────────────
  function setDay(btn){
    day = day === btn.dataset.day ? "" : btn.dataset.day;
    refit = true; choose();
  }
  function setDate(v){
    if (!v) return;
    const [y, m, d] = v.split("-").map(Number);
    const picked = new Date(y, m - 1, d);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    if (picked < today) { toast("Scegli un giorno da oggi in poi"); document.getElementById("fl-date").value = ""; return; }
    day = "data"; syncChips(); dateSel = picked;
    document.getElementById("date-txt").textContent = d + " " + MONTHS[m - 1].slice(0, 3);
    document.getElementById("date-x").hidden = false;
    refit = true; choose();
  }
  // il chip apre il calendario nativo (l'input date invisibile da solo, su computer, apre il calendario solo dalla sua icona)
  function openDate(ev){
    ev.preventDefault();
    const i = document.getElementById("fl-date");
    try { i.showPicker(); } catch (_) { i.focus(); i.click(); }
  }
  function clearDate(ev){
    ev.preventDefault(); ev.stopPropagation();
    day = ""; refit = true; choose();
  }
  document.getElementById("fl-date").min = isoLocal(new Date());
  function inDay(d){
    if (!day) return true;
    if (day === "data") return !!dateSel && dayKey(d) === dayKey(dateSel);
    if (day === "weekend") {
      const wd = d.getDay(), diff = (d - Date.now()) / 86400000;
      return (wd === 0 || wd === 6) && diff < 7;
    }
    return dayKind(d) === day;
  }
  // una scelta fatta: filtri subito e card compatta (nel foglio su telefono resta aperta fino a "Mostra")
  function choose(){
    if (!isSheetOpen()) cardOpen = false;
    syncCard(); render();
  }

  // ── dove ─────────────────────────────────────────────────────────
  function setWhere(w){
    const wasFar = where && distKm(BG, where) > 40;
    where = w;
    hideSugg(); document.getElementById("place").value = "";
    refit = true; choose();
    // un posto oltre 40 km dal centro: il feed si ricarica centrato lì (la chiamata copre 50 km)
    if (where && distKm(BG, where) > 40) loadEvents({ lat: where.lat, lng: where.lng });
    else if (wasFar && feedCenter !== BG) loadEvents(BG);
  }
  function useMyLocation(){
    if (whereIs("me")) { setWhere(null); return; }
    if (locating) return;
    const fallback = () => { locating = false; toast("Non riesco a vedere dove sei. Ti mostro Bergamo."); setWhere(BG_CITY); };
    if (!navigator.geolocation) return fallback();
    locating = true; syncWhere();
    navigator.geolocation.getCurrentPosition(pos => {
      locating = false;
      // arrotondata a ~100 m: non serve di più e non si salva il punto esatto
      const lat = Math.round(pos.coords.latitude * 1000) / 1000, lng = Math.round(pos.coords.longitude * 1000) / 1000;
      setWhere({ kind: "me", name: "vicino a te", lat, lng, km: 15 });
      if (logged) rpc("set_home_location", { p_lat: lat, p_lng: lng }).catch(() => {});
    }, fallback, { timeout: 8000, maximumAge: 300000 });
  }
  // suggerimenti da photon (openstreetmap): città, paesi, frazioni e quartieri entro 60 km da Bergamo
  const PLACE_TYPES = ["city", "town", "village", "hamlet", "suburb", "locality", "neighbourhood", "municipality"];
  async function geoSuggest(q){
    if (q.length < 3) return [];
    try {
      const r = await fetch("https://photon.komoot.io/api?q=" + encodeURIComponent(q) + "&limit=12&lat=45.698&lon=9.670");
      if (!r.ok) return [];
      const d = await r.json();
      const nq = norm(q), qw = nq.split(/[^a-z0-9]+/).filter(w => w.length >= 3);
      const nameOk = name => { const nw = norm(name).split(/[^a-z0-9]+/); return qw.length && qw.every(w => nw.some(h => h === w || (w.length >= 4 && h.startsWith(w)))); };
      const out = [], seen = new Set();
      (d.features || []).forEach(f => {
        const p = f.properties;
        if (!p.name || !nameOk(p.name)) return;
        if (!(PLACE_TYPES.includes(p.type) || PLACE_TYPES.includes(p.osm_value))) return;
        const pt = { lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] };
        const km = distKm(BG, pt);
        if (km > 60 || seen.has(norm(p.name))) return;
        seen.add(norm(p.name));
        out.push({ name: p.name, lat: pt.lat, lng: pt.lng, km });
      });
      return out.slice(0, 5);
    } catch (_) { return []; }
  }
  let suggT = null, suggSeq = 0, sugg = [], suggIdx = -1;
  function onPlaceInput(){
    const q = document.getElementById("place").value.trim();
    clearTimeout(suggT);
    if (q.length < 3) { hideSugg(); return; }
    suggT = setTimeout(async () => {
      const seq = ++suggSeq;
      const list = await geoSuggest(q);
      if (seq !== suggSeq) return;
      sugg = list; suggIdx = -1;
      const box = document.getElementById("cc-sugg");
      box.innerHTML = list.length
        ? list.map((s, i) => `<div role="option" id="sugg-${i}" aria-selected="false" onmousedown="event.preventDefault()" onclick="pickPlace(${i})">${esc(s.name)} <span>· ${Math.round(s.km) < 1 ? "meno di 1" : Math.round(s.km)} km da Bergamo</span></div>`).join("")
        : '<div class="none">Non trovo questo posto. Prova con il nome del paese.</div>';
      box.hidden = false; document.getElementById("place").setAttribute("aria-expanded", "true");
    }, 250);
  }
  function hideSugg(){
    const box = document.getElementById("cc-sugg"); box.hidden = true; box.innerHTML = ""; sugg = []; suggIdx = -1;
    document.getElementById("place").setAttribute("aria-expanded", "false");
    document.getElementById("place").removeAttribute("aria-activedescendant");
  }
  function onPlaceKey(e){
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!sugg.length) return;
      e.preventDefault();
      suggIdx = (suggIdx + (e.key === "ArrowDown" ? 1 : -1) + sugg.length) % sugg.length;
      document.querySelectorAll("#cc-sugg [role=option]").forEach((o, i) => { o.classList.toggle("on", i === suggIdx); o.setAttribute("aria-selected", String(i === suggIdx)); });
      document.getElementById("place").setAttribute("aria-activedescendant", "sugg-" + suggIdx);
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (sugg.length) pickPlace(suggIdx >= 0 ? suggIdx : 0);
    } else if (e.key === "Escape") hideSugg();
  }
  function pickPlace(i){
    const s = sugg[i]; if (!s) return;
    track("cerca_posto", s.name);
    setWhere({ kind: "place", name: s.name, lat: s.lat, lng: s.lng, km: 10 });
  }
  document.getElementById("place").addEventListener("blur", () => setTimeout(hideSugg, 150));

  // ── cosa (testo libero) ──────────────────────────────────────────
  // parole non capite: parola intera o inizio di parola su titolo, chi organizza e luogo; mai la radice ("seriate" non trova "Serio")
  function byText(list, p){
    return list.filter(e => {
      if (p.sports.length && !p.sports.includes(e.slug)) return false;
      if (p.free && e.price > 0) return false;
      if (p.rest.length) {
        const words = norm([e.title, e.host, e.place].join(" ")).split(/[^a-z0-9]+/);
        if (!p.rest.every(w => words.some(h => h === w || (w.length >= 4 && h.startsWith(w))))) return false;
      }
      return true;
    });
  }
  async function search(){
    const text = qInput.value.trim();
    qText = text.slice(0, 120); parsed = qText ? expandQuery(qText) : null;
    if (parsed) {
      if (parsed.day) { day = parsed.day === "all" ? "" : parsed.day; }
      // solo parole vuote ("c'è qualcosa?") o solo un giorno ("domani sera"): nessun filtro sul testo
      if (!parsed.sports.length && !parsed.rest.length && !parsed.free) {
        qText = ""; parsed = null; qInput.value = ""; document.getElementById("cc-what").classList.remove("has");
      }
      // le parole non capite possono essere un posto ("calcetto a Seriate"): si prova se non trovano niente
      else if (parsed.rest.length && !where && !byText(EVENTS, parsed).length) {
        for (const w of parsed.rest) {
          if (w.length < 4) continue;
          const g = (await geoSuggest(w))[0];
          if (g) {
            parsed.rest = parsed.rest.filter(x => x !== w);
            parsed.terms = [...new Set(parsed.rest.map(stem))].filter(x => /^[a-z0-9]{2,30}$/.test(x)).slice(0, 5);
            track("cerca_posto", g.name);
            where = { kind: "place", name: g.name, lat: g.lat, lng: g.lng, km: 10 };
            document.getElementById("place").value = "";
            break;
          }
        }
      }
    }
    if (window.matchMedia("(pointer: coarse)").matches) qInput.blur();
    refit = true; choose();
  }
  function clearAll(){
    day = ""; where = null; qText = ""; parsed = null; locating = false; catSel = "";
    qInput.value = ""; document.getElementById("cc-what").classList.remove("has");
    document.getElementById("place").value = ""; hideSugg();
    refit = true; syncCard(); render();
    if (feedCenter !== BG) loadEvents(BG);
  }
  function dropDay(){ day = ""; refit = true; choose(); }
  function dropWhere(){ setWhere(null); }

  // ── ricerche salvate ("Avvisami quando c'è") ─────────────────────
  function whenKind(){ return day === "weekend" ? "weekend" : (day === "data" && dateSel) ? "date" : "any"; }
  // stessa ricerca già salvata? si confronta quello che manda save_search
  function findSaved(){
    const body = searchBody();
    const same = (a, b) => JSON.stringify((a || []).slice().sort()) === JSON.stringify((b || []).slice().sort());
    return savedSearches.find(s => same(s.sports, body.p_sports) && same(s.terms, body.p_terms) && (s.when_kind || "any") === body.p_when
      && (s.on_date || null) === body.p_on_date && (s.place_label || null) === body.p_place_label && (s.radius_km || null) === body.p_radius_km) || null;
  }
  function searchBody(){
    let sports = parsed ? parsed.sports : [], terms = parsed ? parsed.terms : [];
    // niente tipo né parole ("qualsiasi cosa vicino a Stezzano"): vale per tutto il catalogo
    if (!sports.length && !terms.length) sports = Object.keys(CATALOG);
    return {
      p_text: qText, p_sports: sports, p_terms: terms, p_category: parsed ? parsed.category : null,
      p_when: whenKind(), p_on_date: whenKind() === "date" ? isoLocal(dateSel) : null,
      p_lat: where ? where.lat : null, p_lng: where ? where.lng : null,
      p_radius_km: where ? where.km : null, p_place_label: where ? where.name : null
    };
  }
  async function loadSaved(){
    const r = await rpc("my_saved_searches", {});
    if (!r || !r.ok) return;
    savedSearches = await r.json().catch(() => []);
  }
  async function saveSearch(btn){
    if (!logged) { location.href = "login.html"; return; }
    btn.disabled = true;
    const body = searchBody();
    const r = await rpc("save_search", body);
    if (r && r.ok) {
      const id = await r.json().catch(() => null);
      const row = { id, query_text: body.p_text, category: body.p_category, sports: body.p_sports, terms: body.p_terms, when_kind: body.p_when,
                    on_date: body.p_on_date, place_label: body.p_place_label, radius_km: body.p_radius_km, created_at: new Date().toISOString() };
      if (!savedSearches.some(s => s.id === id)) savedSearches.push(row);
      track("save_search", "q=" + qText + "|w=" + body.p_when + "|p=" + (body.p_place_label || "-"));
      toast("Fatto. Ti avviso appena c'è.");
      render(); return;
    }
    btn.disabled = false;
    let msg = "Non ha funzionato, riprova.";
    try {
      const code = (r ? (await r.json()).message : "") || "";
      if (code.includes("too_many_searches")) msg = "Puoi salvare al massimo 5 ricerche. Togline una da Avvisi.";
      else if (code.includes("not_authenticated")) { logout(); return; }
    } catch (_) {}
    toast(msg);
  }
  async function unsaveSearch(id, btn){
    if (btn) btn.disabled = true;
    const r = await rpc("delete_saved_search", { p_id: id });
    if (!r || !r.ok) { if (btn) btn.disabled = false; toast("Non ha funzionato, riprova."); return; }
    savedSearches = savedSearches.filter(s => s.id !== id);
    render();
  }
  // ?s=<id>: riapre una ricerca salvata (testo, giorno e posto; il centro si ritrova dall'etichetta)
  // ?chiedi=1 (voce "Chiedi" della barra) apre la ricerca con la casella a fuoco; ?q=… (i vecchi link di chiedi.html) cerca subito
  function openChiediFromUrl(){
    const p = new URLSearchParams(location.search);
    const q = p.get("q");
    if (q) { day = ""; qInput.value = q.slice(0, 120); document.getElementById("cc-what").classList.add("has"); search(); return; }
    if (p.get("chiedi") !== "1") return;
    cardOpen = true; syncCard();
    if (mobileFilters.matches) openSheet();
    qInput.focus({ preventScroll: !mobileFilters.matches });
  }
  async function openSavedFromUrl(){
    const id = new URLSearchParams(location.search).get("s");
    if (!id) return;
    const s = savedSearches.find(x => x.id === id);
    if (!s) { toast("Questa ricerca non c'è più."); return; }
    qInput.value = s.query_text || ""; document.getElementById("cc-what").classList.toggle("has", !!s.query_text);
    qText = s.query_text || ""; parsed = qText ? expandQuery(qText) : null;
    day = s.when_kind === "weekend" ? "weekend" : "";
    if (s.when_kind === "date" && s.on_date) { const [y, m, d] = s.on_date.split("-").map(Number); dateSel = new Date(y, m - 1, d); day = "data";
      document.getElementById("date-txt").textContent = d + " " + MONTHS[m - 1].slice(0, 3); document.getElementById("date-x").hidden = false; }
    where = null;
    if (s.place_label === "Bergamo città") where = { ...BG_CITY, km: s.radius_km || 6 };
    else if (s.place_label && s.place_label !== "vicino a te") {
      const g = (await geoSuggest(s.place_label))[0];
      if (g) where = { kind: "place", name: s.place_label, lat: g.lat, lng: g.lng, km: s.radius_km || 10 };
    }
    cardOpen = false; refit = true; syncCard(); render();
    if (s.place_label === "vicino a te") useMyLocation();
  }

  // ── lista ────────────────────────────────────────────────────────
  // " · Pieno" / " · Pieno · 3 in lista d'attesa" nella riga meta, come il prezzo
  function fullHtml(e){ const t = fullTxt(e.going, e.cap, e.wl); return t ? ' · <b style="font-weight:600; color:var(--ink)">' + t + "</b>" : ""; }
  const isFull = e => !!e.cap && e.going >= e.cap;
  // lucchetto (app.js lockState/lockTxt): gli oggetti della lista usano going/community
  const lockOf = e => lockState({ community_id: e.community, going_count: e.going });
  const lockTxtOf = e => lockTxt({ community_id: e.community, going_count: e.going });
  const catLabel = e => e.slug === "festival" ? "Sagra o festa di paese" : (CATALOG[e.slug] || {}).l || e.cat;
  function syncPin(e){
    const m = markers[e.id]; if (!m) return;
    const el = m.getElement(), lk = lockOf(e);
    el.classList.toggle("lock", lk !== "open"); el.classList.toggle("waiting", lk === "waiting");
    paintPin(el, e);
  }
  const isHot = e => e.going >= 2;
  // emoji + (in evidenza) numero di chi ci va e timer sopra il pin
  function paintPin(el, e){
    const hot = isHot(e);
    el.classList.toggle("hot", hot); el.setAttribute("data-n", e.going);
    el.innerHTML = esc(e.emoji) + `<span class="tm ${relClass(e.when, e.end)}">${esc(relTime(e.when, e.end))}</span>`;
  }
  function stateBtn(e){
    if (e.mine) return ["ok", "Lo organizzi tu"];
    if (e.my === "going") return ["ok", "Ci vado ✓"];
    if (e.my === "requested") return ["wait", "Aspetto l'ok"];
    if (e.my === "waitlisted") return ["wait", "In lista d'attesa"];
    if (lockOf(e) === "closed") return ["", "Sblocca l'evento"];
    if (e.request) return ["", "Chiedo di entrare →"];
    // pieno: in fila ci si mette dalla pagina dell'evento, dove c'è la spiegazione
    // (il feed non dice se la lista d'attesa è accesa: assumo di sì, è il default; se è spenta la pagina lo spiega)
    if (isFull(e)) return ["", "Lista d'attesa →"];
    return ["", "Ci sono →"];
  }
  const kmTxt = km => km < 1 ? "a meno di 1 km" : "a " + Math.round(km) + " km";
  // card di un evento; withDay: il giorno davanti all'ora (fuori dai gruppi per giorno)
  function relHtmlOf(e){
    const rel = relTime(e.when, e.end);
    return rel === "in corso" ? '<span class="live">in corso adesso</span>' : `<span class="${relClass(e.when, e.end)}">${esc(rel)}</span>`;
  }
  function evCard(e, withDay, hot){
    const [cls, label] = stateBtn(e);
    const time = (withDay ? dayLabel(e.when) + " · " : "") + timeStr(e.when) + (e.end && dayKey(e.end) === dayKey(e.when) ? " – " + timeStr(e.end) : "");
    const relHtml = relHtmlOf(e);
    const lk = lockOf(e), locked = lk !== "open", closed = lk === "closed";
    // da chiuso: categoria e città al posto di chi organizza e dell'indirizzo
    const metaClosed = `${esc(catLabel(e))} · ${esc(cityOf(e.place) || e.place)}${where ? " · " + kmTxt(distKm(where, e)) : ""} · ${lockTxtOf(e)}${e.gender === "donna" ? " · solo donne" : e.gender === "uomo" ? " · solo uomini" : ""}`;
    return `<div class="ev${locked ? " lock" : ""}${lk === "waiting" ? " waiting" : ""}${closed ? " closed" : ""}${hot ? " hot" : ""}" id="ev-${e.id}" onclick="location.href='evento.html?id=${e.id}'" onmouseenter="highlight('${e.id}', false)">
        <div class="tile"${e.photo && !locked ? ` style="background-image:url('${esc(e.photo)}'); background-size:cover; background-position:center"` : ""}>${e.photo && !locked ? "" : e.emoji}</div>
        <div>
          <div class="time">${esc(time)} · <span class="rel" data-id="${e.id}">${relHtml}</span></div>
          <a class="t" href="evento.html?id=${e.id}" onclick="event.stopPropagation()" style="display:block">${esc(e.title)}</a>
          <div class="m">${closed ? metaClosed : ""}${closed ? "" : `${e.host ? (e.hostAvatar ? `<span class="ha" style="background-image:url('${esc(e.hostAvatar)}')"></span>` : "") + "Di " + esc(e.host) : "Da un altro sito"} · ${esc(e.place)}${where ? " · " + kmTxt(distKm(where, e)) : ""} · ${lockTxtOf(e)}${fullHtml(e)}${e.request ? " · con approvazione" : ""}${e.gender === "donna" ? " · solo donne" : e.gender === "uomo" ? " · solo uomini" : ""}${e.price > 0 ? ' · <b style="font-weight:600; color:var(--ink)">' + esc(fmtPrice(e.price)) + "</b>" : ""}`}</div>${hot ? `<span class="fa">✓ Si fa · ${e.going} ci vanno</span>` : ""}
        </div>
        <button class="go ${cls}" onclick="event.stopPropagation(); join('${e.id}')">${label}</button>
      </div>`;
  }
  const clean = s => s.replace(/\s+/g, " ").replace(/\s+([:.,?])/g, "$1").trim();

  function render(){
    const list = document.getElementById("list");
    const byWhat = parsed ? byText(EVENTS, parsed) : EVENTS;
    const evs = byWhat
      .filter(e => inDay(e.when))
      .filter(inCat)
      .filter(e => !where || distKm(where, e) <= where.km);

    const n = evs.length;
    syncPill(n);
    // niente da mostrare: la lista sale da sola, altrimenti "Avvisami quando c'è" resta sotto la mappa
    if (mobileFilters.matches && n === 0 && !isSheetOpen()) showList(true);
    document.getElementById("count").textContent = clean(n + (n === 1 ? " evento " : " eventi ") +
      (hasChoice() ? whatPhrase() + " " + dayText() + " " + whereText() : "in programma"));
    const show = document.getElementById("fl-show");
    show.classList.toggle("zero", !n);
    show.innerHTML = n ? 'Mostra <span id="fl-count">' + (n === 1 ? "1 evento" : n + " eventi") + "</span>" : "Nessun evento";
    // i pin fuori filtro spariscono (non sbiaditi); il popup di un pin che sparisce si chiude
    const vis = new Set(evs.map(e => e.id));
    EVENTS.forEach(e => {
      const m = markers[e.id], on = vis.has(e.id);
      m.getElement().style.display = on ? "" : "none";
      if (!on) { const p = m.getPopup(); if (p && p.isOpen()) m.togglePopup(); }
    });
    mapPill.hidden = !!n || !EVENTS.length;
    showRadius = !n && !!where; syncRadius();
    lastVisible = evs;
    if (refit) { refit = false; fitVisible(); }

    if (!n) { list.innerHTML = emptyHtml(byWhat); return; }

    // in evidenza: i piani che si fanno già (2+ persone), i primi 3 per quante persone ci vanno; poi i giorni, senza ripeterli
    const hot = evs.filter(isHot).sort((a, b) => b.going - a.going || a.when - b.when).slice(0, 3);
    const hotIds = new Set(hot.map(e => e.id));
    let html = "", lastDay = "";
    if (hot.length) {
      html += `<div class="day hot"><span class="dot">🔥</span><b>In evidenza</b><span>si fanno già</span></div>`;
      hot.forEach(e => { html += evCard(e, true, true); });
    }
    evs.filter(e => !hotIds.has(e.id)).forEach(e => {
      const dk = dayKey(e.when);
      if (dk !== lastDay) {
        lastDay = dk;
        const isToday = dayKind(e.when) === "oggi";
        html += `<div class="day${isToday ? " today" : ""}"><span class="dot"></span><b>${dayLabel(e.when)}</b><span>${daySub(e.when)}</span></div>`;
      }
      html += evCard(e, false);
    });
    list.innerHTML = html;
  }

  // nessun risultato (spec §5): a) esiste in un altro giorno o posto; b) non esiste, "Avvisami quando c'è"
  function emptyHtml(byWhat){
    if (!EVENTS.length) return '<div class="empty">Per ora non c\'è nessun evento. <a href="crea.html">Pubblica tu il primo</a>.</div>';
    const what = whatText(), subject = !what ? "Nessun evento" : what === "gratis" ? "Niente di gratis" : "Nessuno fa " + what;
    // solo un giorno, niente altro: si resta sulla frase semplice
    if (!qText && !where && day) {
      return '<div class="empty">Niente ' + esc(dayText()) + ". " + (day !== "domani" ? '<a href="#" onclick="setDay(document.querySelector(\'.day-chip[data-day=domani]\')); return false">Guarda domani</a> oppure ' : "") +
        '<a href="#" onclick="dropDay(); return false">' + (day !== "domani" ? "togli" : "Togli") + " il giorno</a>.</div>";
    }
    // a) la cosa cercata esiste, ma non nel giorno o nel posto scelto
    if ((qText || day) && byWhat.length) {
      const pool = byWhat.slice();
      const byDist = where && !day;
      if (byDist) pool.sort((a, b) => distKm(where, a) - distKm(where, b));
      const next = pool.slice(0, 3), f = next[0];
      const town = f.place.split(/,|·/)[0].trim();
      const intro = byDist ? `Il più vicino è a ${esc(town)}, ${esc(dayLabel(f.when).toLowerCase())}:` : `Il prossimo è ${esc(dayLabel(f.when).toLowerCase())}${where ? " a " + esc(town) : ""}:`;
      return `<div class="nores" role="status">
        <h3>${esc(clean(subject + " " + dayText() + " " + whereText()))}. <span>${intro}</span></h3>
        ${next.map(e => evCard(e, true)).join("")}
        <div class="chips">${day ? '<button class="chip" onclick="dropDay()">Cambia giorno</button>' : ""}${where ? '<button class="chip" onclick="dropWhere()">Togli il posto</button>' : ""}</div>
      </div>`;
    }
    // b) non esiste nei prossimi giorni, da nessuna parte
    const key = "q=" + qText + "|d=" + (day || "-") + "|p=" + (where ? where.name : "-");
    if (key !== lastEmptyKey) { lastEmptyKey = key; track("cerca_vuoto", key); }
    const title = clean(subject + " " + whereText() + " nei prossimi giorni") + ".";
    const emoji = parsed && parsed.slugs.length ? (CATALOG[parsed.slugs[0]] || {}).e : parsed && parsed.category ? CAT_EMOJI[parsed.category] : "";
    const meanwhile = '<div class="meanwhile">Intanto, nei prossimi giorni:</div>' + EVENTS.slice(0, 3).map(e => evCard(e, true)).join("");
    const s = findSaved();
    if (s) {
      const who = !what ? "qualcosa" : what === "gratis" ? "qualcosa gratis" : what;
      return `<div class="saved" role="status">
        <div class="bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10 C 6 6.7, 8.7 4, 12 4 C 15.3 4, 18 6.7, 18 10 L18 15 L20 17.5 L4 17.5 L6 15 Z"/><path d="M10 20.5 C 10.5 21.3, 13.5 21.3, 14 20.5"/></svg></div>
        <div><h3>${esc(clean("Ti avviso appena qualcuno propone " + who + " " + whereText()))}.</h3>
        <p>Un avviso qui e una email. Le ricerche salvate le trovi in <a href="notifiche.html">Avvisi</a>. · <button onclick="unsaveSearch('${esc(s.id)}', this)">Non avvisarmi più</button></p></div>
      </div>` + meanwhile;
    }
    return `<div class="nores" role="status">
      <div class="head">${emoji ? `<div class="tile">${emoji}</div>` : ""}<div><h3>${esc(title)}</h3><p>Vuoi che ti avvisi quando qualcuno lo propone?</p></div></div>
      <div class="btns"><button class="btn blue" onclick="saveSearch(this)">Avvisami quando c'è</button><a class="btn ghost" href="crea.html">Oppure proponilo tu →</a></div>
      <div class="note">Ricevi un avviso qui e una email. Puoi toglierlo quando vuoi.</div>
    </div>` + meanwhile;
  }

  // inquadra i pin visibili (solo quando cambia giorno/data; mai con la mappa nascosta su telefono)
  function fitVisible(){
    if (!lastVisible.length) return;
    const b = new maplibregl.LngLatBounds();
    lastVisible.forEach(e => b.extend([e.lng, e.lat]));
    map.fitBounds(b, { padding: 60, maxZoom: 14, duration: 500 });
  }
  function highlight(id, pan){
    document.querySelectorAll(".ev").forEach(x => x.classList.remove("on"));
    document.querySelectorAll(".pin").forEach(x => x.classList.remove("on"));
    const row = document.getElementById("ev-" + id);
    const pin = document.getElementById("pin-" + id);
    if (row) { row.classList.add("on"); row.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    if (pin) pin.classList.add("on");
    const ev = EVENTS.find(e => e.id === id);
    if (pan) {
      map.easeTo({ center: [ev.lng, ev.lat] });
      Object.values(markers).forEach(m => { const p = m.getPopup(); if (p && p.isOpen()) m.togglePopup(); });
      markers[id].togglePopup();
    }
  }

  function askLogin(id){
    try { sessionStorage.setItem("anyplans_next", "evento.html?id=" + id + "&join=1"); } catch (_) {}
    toast("Per iscriverti serve un account: è gratis, ci vuole un minuto.");
    setTimeout(() => location.href = "login.html", 900);
  }
  async function join(id){
    if (!logged) return askLogin(id);
    const e = EVENTS.find(x => x.id === id);
    if (e.mine) { location.href = "evento.html?id=" + id; return; }
    // piano chiuso: aprirlo = creare il proprio piano (fascia d'età, posti), non un semplice "ci sono"
    if (lockOf(e) === "closed" && e.my !== "going") { explainLock("crea.html?from=" + id); return; }
    const leaving = e.my === "going" || e.my === "requested";
    // in lista d'attesa, o pieno: tutto dalla pagina dell'evento
    if (e.my === "waitlisted" || (!leaving && !e.request && isFull(e))) { location.href = "evento.html?id=" + id; return; }
    if (leaving && e.my === "requested" && !confirm("Vuoi annullare la richiesta?")) return;
    if (!leaving) {
      // se l'host ha messo delle domande si risponde nella pagina dell'evento
      const rq = await rpc("get_activity_questions", { p_activity_id: id });
      const qs = rq && rq.ok ? await rq.json().catch(() => []) : [];
      if (qs.length) { location.href = "evento.html?id=" + id + "&join=1"; return; }
    }
    let r;
    if (leaving) r = await rpc("join_activity", { p_activity_id: id, p_status: "left" });
    else if (e.request) r = await rpc("request_to_join", { p_activity_id: id });
    else r = await rpc("join_activity", { p_activity_id: id, p_status: "going" });
    if (r && r.ok) {
      if (leaving) { if (e.my === "going") e.going -= 1; e.my = "left"; }
      else if (e.request) { e.my = "requested"; toast("Richiesta mandata. Quando chi organizza dice sì, ti avvisiamo."); track("join_request"); }
      else { e.my = "going"; e.going += 1; toast("Fatto, ci vai! Il tuo nome è nella lista dei partecipanti."); track("join"); }
      render(); syncPin(e);
      return;
    }
    let msg = "Non ha funzionato, riprova.";
    try {
      const b = r ? await r.json() : {};
      const code = b.message || "";
      if (code.includes("profile_required")) { location.href = "profilo.html"; return; }
      else if (code.includes("activity_full")) { msg = "Posti finiti per questo evento."; if (e.cap) { e.going = e.cap; render(); } }
      else if (code.includes("age_not_allowed")) msg = "Questo evento non è aperto alla tua età.";
      else if (code.includes("not_authenticated")) { logout(); return; }
    } catch (_) {}
    toast(msg);
  }

  // il timer corre: ogni minuto aggiorno le scritte "tra 2 h 14 min" delle card e dei pin, senza ridisegnare la lista
  setInterval(() => {
    document.querySelectorAll(".rel[data-id]").forEach(el => { const e = EVENTS.find(x => x.id === el.dataset.id); if (e) el.innerHTML = relHtmlOf(e); });
    EVENTS.forEach(e => { const m = markers[e.id]; if (m && m.getElement().style.display !== "none") paintPin(m.getElement(), e); });
  }, 60000);
  syncCard();
  if (logged) checkProfile();
  Promise.all([loadEvents(), logged ? loadSaved() : null]).then(() => {
    openChiediFromUrl();
    if (!logged) return;
    openSavedFromUrl();
    // pallino sulla campanella: in silenzio se la rpc non c'è ancora
    rpc("unread_notifications", {}).then(async r => {
      if (!r || !r.ok) return;
      const n = await r.json().catch(() => 0);
      if (Number(n) > 0) document.getElementById("bell-dot").hidden = false;
    }).catch(() => {});
  });
  // telefono: la lista è un foglio sopra la mappa; la pill dice quanti eventi ci sono e cosa apre
  function showList(on){
    document.body.classList.toggle("showlist", on);
    cardOpen = false; syncCard(); syncPill(lastVisible.length);
    if (!on) setTimeout(() => map.resize(), 60);
  }
  function toggleMap(){ showList(!document.body.classList.contains("showlist")); }
  function syncPill(n){
    const b = document.getElementById("maptoggle"), on = document.body.classList.contains("showlist");
    b.innerHTML = on ? "🗺️ Mappa" : "☰ Lista" + (n ? " · " + n + (n === 1 ? " evento" : " eventi") : "");
    b.setAttribute("aria-label", on ? "Torna alla mappa" : "Apri la lista");
  }
</script>
</body>
