<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I gruppi che seguo · anyplans</title>
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="robots" content="noindex">
<style>
  @font-face{
    font-family:"Bricolage Grotesque";
    src:url("/bricolage-grotesque-latin-800-normal.woff2") format("woff2");
    font-weight:800; font-style:normal; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  :root{
    --blue:#1B4FD8; --blue-lo:#1440AF; --tint:#E9EEFB;
    --ink:#191919; --grey:#6E6E73; --bg:#FBF9F5;
    --round: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Bricolage Grotesque", var(--round);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--round); color:var(--ink); background:var(--bg); line-height:1.5;
       -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  .display{font-family:var(--display); font-weight:800; letter-spacing:-.045em; line-height:1.05;}
  .lnk{font-weight:700; font-size:14px; color:var(--blue);}

  .fw-main{margin:0 auto; display:flex; flex-direction:column; gap:12px;}
  .fw-h1{font-size:28px; margin-top:6px;} .fw-h1 span{color:var(--blue);}
  .fw-sub{font-size:14.5px; color:var(--grey); margin-top:-6px;}
  .fw-list{display:flex; flex-direction:column; gap:8px;}
  .fw-row{display:grid; grid-template-columns:48px 1fr auto; gap:4px 14px; align-items:center; background:#fff;
          border:1.5px solid rgba(25,25,25,.10); border-radius:16px; padding:12px 14px; min-width:0;}
  .fw-logo{width:48px; height:48px; border-radius:12px; background:var(--tint); display:flex; align-items:center;
           justify-content:center; font-size:24px; flex-shrink:0;}
  .fw-body{min-width:0;}
  .fw-name{display:flex; align-items:center; gap:5px; font-weight:700; font-size:16px;}
  .fw-name span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;} .fw-name svg{width:16px; height:16px; flex-shrink:0;}
  .fw-meta{font-size:13.5px; color:var(--grey);}
  .fw-unfollow{height:44px; padding:0 16px; border-radius:999px; background:#fff; border:1.5px solid rgba(25,25,25,.28);
               color:var(--ink); font:700 14px var(--round); cursor:pointer; white-space:nowrap;
               transition:border-color .15s ease, background .15s ease, transform .12s ease;}
  .fw-unfollow:hover{border-color:var(--ink); background:#F4F2EC;} .fw-unfollow:active{transform:scale(.96);}
  .fw-unfollow:disabled{opacity:.6; cursor:default;}
  .fw-empty{color:var(--grey); font-size:15px; padding:20px 4px; line-height:1.5;} .fw-empty a{color:var(--blue); font-weight:700;}
  .fw-manage{font-weight:700; font-size:14.5px; color:var(--blue); padding:8px 4px;} .fw-manage[hidden]{display:none;}
  .fw-sk{height:74px; border-radius:16px; background:linear-gradient(90deg,#F1EFE9 25%,#E9E6DE 50%,#F1EFE9 75%);
         background-size:200% 100%; animation:fwsk 1.2s ease-in-out infinite;}
  @keyframes fwsk{from{background-position:200% 0} to{background-position:-200% 0}}
  @media (max-width:700px){
    .fw-row{grid-template-columns:48px 1fr;} .fw-name span{white-space:normal;}
    .fw-unfollow{grid-column:2; justify-self:start; margin-top:4px;}
  }
  a:focus-visible, button:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
</style>
</head>
<body>

<header></header>

<main class="fw-main">
  <a class="lnk" href="profilo.html">← Il mio profilo</a>
  <h1 class="display fw-h1">I gruppi che <span>seguo</span></h1>
  <p class="fw-sub">Ti avvisiamo a ogni loro nuovo evento.</p>
  <div class="fw-list" id="list"><div class="fw-sk"></div><div class="fw-sk"></div><div class="fw-sk"></div></div>
  <a class="fw-manage" id="manage" href="impostazioni.html#gruppo" hidden>I gruppi che gestisco →</a>
</main>

<script src="app.js?v=1788726787"></script>
<script>
  requireLogin();
  mountNav("", { col: 860 });
  mountTabbar("profilo");
  track("following_view");

  const CAT_EMOJI = { sport:"🏃", cucina:"🍳", "creatività":"🏺", giardinaggio:"🌱", cultura:"🎪", benessere:"🧘" };
  const emojiOf = c => c.emoji || CAT_EMOJI[c.category] || "📍";
  const upcomingTxt = n => { n = Number(n) || 0; return n === 0 ? "Nessun evento in programma" : n === 1 ? "1 evento in programma" : n + " eventi in programma"; };
  let ROWS = []; // solo i gruppi che seguo (role === "follower"), in ordine di nome

  async function load(){
    const list = document.getElementById("list");
    const r = await rpc("my_communities", {});
    if (!r || !r.ok) { list.innerHTML = '<div class="fw-empty">Non riesco a caricare i gruppi. Ricarica la pagina.</div>'; return; }
    const rows = await r.json().catch(() => []);
    document.getElementById("manage").hidden = !rows.some(c => c.role === "owner" || c.role === "admin");
    ROWS = rows.filter(c => c.role === "follower")
      .sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "it"));
    render();
  }

  function row(c){
    const href = "community.html?slug=" + encodeURIComponent(c.slug || "");
    const vb = c.is_verified
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#1B4FD8"/><path d="M7.5 12.5 L10.7 15.7 L16.5 9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : "";
    return `<div class="fw-row" data-id="${esc(c.id)}">
      <a class="fw-logo" href="${esc(href)}" aria-hidden="true" tabindex="-1">${esc(emojiOf(c))}</a>
      <div class="fw-body">
        <a class="fw-name" href="${esc(href)}"><span>${esc(c.name)}</span>${vb}</a>
        <div class="fw-meta">${upcomingTxt(c.upcoming_count)}</div>
      </div>
      <button class="fw-unfollow" type="button" aria-label="Non seguire più ${esc(c.name)}" onclick="unfollow('${esc(c.id)}')">Non seguire più</button>
    </div>`;
  }

  function render(){
    const list = document.getElementById("list");
    if (!ROWS.length) { list.innerHTML = '<div class="fw-empty">Non segui ancora nessun gruppo. <a href="gruppi.html">Guarda i gruppi a Bergamo →</a></div>'; return; }
    list.innerHTML = ROWS.map(row).join("");
  }

  async function unfollow(id){
    const idx = ROWS.findIndex(x => x.id === id);
    if (idx < 0) return;
    const c = ROWS[idx];
    if (!confirm("Vuoi smettere di seguire " + c.name + "?")) return;
    // subito: bottone spento e riga via; se non va, la riga torna al suo posto
    const btn = document.querySelector('.fw-row[data-id="' + CSS.escape(id) + '"] .fw-unfollow');
    if (btn) btn.disabled = true;
    ROWS.splice(idx, 1); render();
    const r = await rpc("follow_community", { p_id: id, p_follow: false });
    if (!r || !r.ok) {
      ROWS.splice(idx, 0, c); render();
      toast("Non ha funzionato, riprova."); return;
    }
    toast("Non segui più " + c.name + ".");
    track("unfollow");
  }

  load();
</script>
</body>
</html>
